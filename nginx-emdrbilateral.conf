# HTTP → HTTPS redirect for both domains
server {
    listen 80 default_server;
    server_name emdrbilateral.online emdrbilateral.ru;
    return 301 https://$host$request_uri;
}

# emdrbilateral.online → port 8080
server {
    listen 443 ssl;
    http2 on;
    server_name emdrbilateral.online;
    ssl_certificate /etc/letsencrypt/live/emdrbilateral.online-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emdrbilateral.online-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # /breathing — allow Telegram Mini App framing
    location /breathing {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Override: remove DENY for Telegram iframe
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;
    }

    location / {
        limit_req zone=emdr_general burst=60 nodelay;
        limit_conn emdr_ws 20;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# emdrbilateral.ru → port 8081
server {
    listen 443 ssl;
    http2 on;
    server_name emdrbilateral.ru;
    # Use .online ECDSA cert that also covers emdrbilateral.ru (RSA cert breaks macOS TLS)
    ssl_certificate /etc/letsencrypt/live/emdrbilateral.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emdrbilateral.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
