<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый тест синхронизации (WebSocket)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .test-section { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
        .test-section h2 { margin: 0 0 20px 0; color: #60a5fa; border-bottom: 2px solid #374151; padding-bottom: 10px; }
        .canvas-container { position: relative; display: inline-block; border: 2px solid #374151; border-radius: 8px; overflow: hidden; margin: 20px 0; }
        .preview-canvas { display: block; background: #020617; }
        .test-controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
        .test-btn { padding: 12px 20px; font-size: 14px; font-weight: 500; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; min-width: 120px; }
        .test-btn:hover { background: #1d4ed8; }
        .log-panel { background: #0f172a; border-radius: 8px; padding: 16px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .log-entry { margin-bottom: 4px; font-size: 13px; font-family: monospace; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
        .status-panel { background: #0f172a; border-radius: 8px; padding: 16px; margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .status-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .status-value { font-weight: 500; }
        .status-connected { color: #10b981; }
        .status-disconnected { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-section">
            <h2>⚡ Быстрый тест синхронизации (WebSocket)</h2>
            <div class="canvas-container">
                <canvas id="previewCanvas" width="400" height="300" class="preview-canvas"></canvas>
            </div>
            <div class="test-controls">
                <button class="test-btn" onclick="runQuickSyncTest()">🚀 Быстрый тест</button>
                <button class="test-btn" onclick="resetTest()">🔄 Сброс</button>
            </div>
            <div class="status-panel">
                <div>
                    <h3>📊 Статус системы</h3>
                    <div class="status-item"><span>🔌 WebSocket:</span><span class="status-value status-disconnected" id="wsStatus">Отключен</span></div>
                    <div class="status-item"><span>🎮 Контроллер:</span><span class="status-value status-disconnected" id="controllerStatus">Отключен</span></div>
                    <div class="status-item"><span>👁️ Вьювер:</span><span class="status-value status-disconnected" id="viewerStatus">Отключен</span></div>
                </div>
                <div>
                    <h3>🎯 Состояние мяча (от сервера)</h3>
                    <div class="status-item"><span>📍 Позиция:</span><span class="status-value" id="ballPosition">N/A</span></div>
                    <div class="status-item"><span>- Отклонение:</span><span class="status-value" id="positionDiff">N/A</span></div>
                </div>
            </div>
        </div>
        <div class="test-section">
            <h2>📝 Лог тестирования</h2>
            <div class="log-panel">
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/physics-engine.js"></script>
    <script src="/js/renderer.js"></script>
    <script src="/js/websocket-client.js"></script>

    <script>
        let sessionId = null;
        let controllerSocket, viewerSocket;
        let previewRenderer, previewPhysics;

        document.addEventListener('DOMContentLoaded', initializeSystem);

        async function initializeSystem() {
            log('info', '🚀 Инициализация теста...');
            try {
                const response = await fetch('/api/session', { method: 'POST' });
                const data = await response.json();
                sessionId = data.sessionId;
                log('success', `✅ Сессия создана: ${sessionId}`);
                initializePreview();
                setupWebSockets();
            } catch (error) {
                log('error', `❌ Ошибка инициализации: ${error.message}`);
            }
        }

        function initializePreview() {
            const canvas = document.getElementById('previewCanvas');
            previewPhysics = new PhysicsEngine({
                worldWidth: canvas.width,
                worldHeight: canvas.height,
                isViewer: true 
            });
            previewRenderer = new BallRenderer(canvas, previewPhysics, { localPhysics: true });
            previewRenderer.start();
            log('info', '👁️ Превью инициализировано');
        }

        function setupWebSockets() {
            // Контроллер
            controllerSocket = new WebSocketClient(sessionId, 'controller');
            controllerSocket.on('open', () => {
                updateStatus('controllerStatus', 'Подключен', 'connected');
                log('success', '🎮 Контроллер подключен к WebSocket');
            });
            controllerSocket.on('close', () => updateStatus('controllerStatus', 'Отключен', 'disconnected'));

            // Вьювер
            viewerSocket = new WebSocketClient(sessionId, 'viewer');
            viewerSocket.on('open', () => {
                updateStatus('viewerStatus', 'Подключен', 'connected');
                log('success', '👁️ Вьювер подключен к WebSocket');
            });
            viewerSocket.on('state_update', (state) => {
                previewPhysics.applyCommand(state);
                updateBallStatus(state);
            });
            viewerSocket.on('close', () => updateStatus('viewerStatus', 'Отключен', 'disconnected'));
            
            controllerSocket.connect();
            viewerSocket.connect();
            updateStatus('wsStatus', 'Подключен', 'connected');
        }

        function runQuickSyncTest() {
            log('info', '⚡ Запуск быстрого теста...');
            const commands = [
                { type: 'controller_update', payload: { paused: false, dirX: 1, dirY: 0, speed: 50 } },
                { type: 'controller_update', payload: { speed: 80 } },
                { type: 'controller_update', payload: { colorBall: '#ef4444' } },
                { type: 'controller_update', payload: { paused: true } }
            ];
            
            commands.forEach((cmd, i) => {
                setTimeout(() => {
                    log('info', `Отправка команды: ${JSON.stringify(cmd.payload)}`);
                    controllerSocket.send(cmd.type, cmd.payload);
                }, i * 2000);
            });
        }
        
        function resetTest() {
            log('info', '🔄 Сброс теста...');
            controllerSocket.send('controller_update', { reset: true, paused: true });
            location.reload();
        }

        function updateBallStatus(serverState) {
            const localState = previewPhysics.getState();
            document.getElementById('ballPosition').textContent = `${Math.round(serverState.x)}, ${Math.round(serverState.y)}`;
            const diff = Math.sqrt(Math.pow(localState.x - serverState.x, 2) + Math.pow(localState.y - serverState.y, 2));
            document.getElementById('positionDiff').textContent = `${diff.toFixed(2)}px`;
        }
        
        function updateStatus(elementId, text, statusClass) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `status-value status-${statusClass}`;
        }

        function log(type, message) {
            const container = document.getElementById('logContainer');
            container.innerHTML += `<div class="log-entry log-${type}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
