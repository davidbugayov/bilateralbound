<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый тест синхронизации</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .test-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .test-section h2 {
            margin: 0 0 20px 0;
            color: #60a5fa;
            border-bottom: 2px solid #374151;
            padding-bottom: 10px;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            border: 2px solid #374151;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }

        .preview-canvas {
            display: block;
            background: #020617;
        }

        .test-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .test-btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .test-btn:hover {
            background: #1d4ed8;
        }

        .test-btn.success {
            background: #10b981;
        }

        .test-btn.error {
            background: #ef4444;
        }

        .test-btn.warning {
            background: #f59e0b;
        }

        .log-panel {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-panel h4 {
            margin: 0 0 12px 0;
            color: #60a5fa;
        }

        .log-entry {
            margin-bottom: 4px;
            font-size: 13px;
            font-family: monospace;
        }

        .log-success {
            color: #10b981;
        }

        .log-error {
            color: #ef4444;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-warning {
            color: #f59e0b;
        }

        .status-panel {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-value {
            font-weight: 500;
        }

        .status-connected {
            color: #10b981;
        }

        .status-disconnected {
            color: #ef4444;
        }

        .status-waiting {
            color: #f59e0b;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .status-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-section">
            <h2>⚡ Быстрый тест синхронизации</h2>

            <div class="canvas-container">
                <canvas id="previewCanvas" width="400" height="300" class="preview-canvas"></canvas>
            </div>

            <div class="test-controls">
                <button class="test-btn" onclick="runQuickSyncTest()">🚀 Быстрый тест (10с)</button>
                <button class="test-btn" onclick="runBounceSyncTest()">🎯 Тест отскоков (15с)</button>
                <button class="test-btn" onclick="runDirectionSyncTest()">🧭 Тест направлений (8с)</button>
                <button class="test-btn" onclick="runFullSyncTest()">🔬 Полный тест (30с)</button>
                <button class="test-btn" onclick="resetTest()">🔄 Сброс</button>
                <button class="test-btn" onclick="clearLog()">🗑️ Очистить лог</button>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="status-panel">
                <div>
                    <h3>📊 Статус системы</h3>
                    <div class="status-item">
                        <span>🎮 Контроллер:</span>
                        <span class="status-value status-connected" id="controllerStatus">Подключен</span>
                    </div>
                    <div class="status-item">
                        <span>👁️ Вьювер:</span>
                        <span class="status-value status-disconnected" id="viewerStatus">Не подключен</span>
                    </div>
                    <div class="status-item">
                        <span>⚡ Синхронизация:</span>
                        <span class="status-value status-waiting" id="syncStatus">Ожидание</span>
                    </div>
                </div>
                <div>
                    <h3>🎯 Состояние мяча</h3>
                    <div class="status-item">
                        <span>📍 Позиция:</span>
                        <span class="status-value" id="ballPosition">400, 300</span>
                    </div>
                    <div class="status-item">
                        <span>💨 Скорость:</span>
                        <span class="status-value" id="ballSpeed">0, 0</span>
                    </div>
                    <div class="status-item">
                        <span>🎪 Отскоки:</span>
                        <span class="status-value" id="bounceCount">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>📝 Результаты тестирования</h2>

            <div class="log-panel">
                <h4>📋 Лог операций</h4>
                <div id="logContainer">
                    <div class="log-entry log-info">Система инициализирована</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let sessionId = null;
        let syncInterval = null;
        let testInterval = null;
        let bounceCount = 0;
        let testStartTime = 0;
        let testDuration = 0;

        // Canvas для превью
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        // Инициализация
        document.addEventListener('DOMContentLoaded', async function() {
            await initializeSystem();
        });

        // Основная инициализация системы
        async function initializeSystem() {
            try {
                log('info', '🚀 Инициализация быстрого теста синхронизации...');

                // Создаем сессию
                const response = await fetch('/api/session', { method: 'POST' });
                if (!response.ok) throw new Error('Не удалось создать сессию');

                const data = await response.json();
                sessionId = data.sessionId;

                log('success', `✅ Сессия создана: ${sessionId}`);

                // Инициализируем превью
                initializePreview();

                // Запускаем синхронизацию
                startSync();

                log('success', '🎉 Система готова к быстрому тестированию!');

            } catch (error) {
                log('error', '❌ Ошибка инициализации: ' + error.message);
            }
        }

        // Инициализация превью
        function initializePreview() {
            log('info', '👁️ Инициализация превью с локальной физикой...');

            // Создаем локальную физику для превью
            window.__previewPhysics = new PhysicsEngine({
                worldWidth: previewCanvas.width,
                worldHeight: previewCanvas.height,
                ballRadius: 20
            });

            // Создаем рендерер с локальной физикой
            window.__previewRenderer = new BallRenderer(previewCanvas, window.__previewPhysics, {
                localPhysics: true
            });

            // Запускаем рендерер
            window.__previewRenderer.start();

            // Запускаем локальную физику по умолчанию
            window.__previewPhysics.setPaused(false);
            window.__previewPhysics.startMovement(1, 0, 40);

            log('success', '✅ Превью с локальной физикой инициализировано');
        }

        // Рисование мяча
        function drawBall(x, y, radius, color) {
            previewCtx.fillStyle = color;
            previewCtx.beginPath();
            previewCtx.arc(x, y, radius, 0, 2 * Math.PI);
            previewCtx.fill();
        }

        // Запуск синхронизации
        function startSync() {
            if (syncInterval) clearInterval(syncInterval);

            syncInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/session/${sessionId}/state`);
                    if (!response.ok) {
                        updateStatus('syncStatus', 'Ошибка', 'error');
                        return;
                    }

                    const state = await response.json();
                    updatePreview(state);
                    updateStatus('syncStatus', 'Активна', 'connected');

                } catch (error) {
                    updateStatus('syncStatus', 'Ошибка', 'error');
                    log('error', 'Ошибка синхронизации: ' + error.message);
                }
            }, 50); // Очень быстрая синхронизация - 50ms
        }

        // Обновление превью на основе состояния
        function updatePreview(state) {
            if (!state) return;

            // Синхронизируем локальную физику с состоянием сервера
            if (window.__previewPhysics && state) {
                // Синхронизируем позицию
                if (state.x !== undefined && state.y !== undefined) {
                    window.__previewPhysics.setPosition(state.x * previewCanvas.width / (state.viewerScreenSize?.width || 1920),
                                                       state.y * previewCanvas.height / (state.viewerScreenSize?.height || 1080));
                }

                // Синхронизируем скорость
                if (state.vx !== undefined && state.vy !== undefined) {
                    window.__previewPhysics.setVelocity(state.vx * previewCanvas.width / (state.viewerScreenSize?.width || 1920),
                                                       state.vy * previewCanvas.height / (state.viewerScreenSize?.height || 1080));
                }

                // Синхронизируем паузу
                if (state.paused !== undefined) {
                    window.__previewPhysics.setPaused(state.paused);
                }

                // Синхронизируем цвета
                if (state.colorBall) {
                    window.__previewPhysics.setBallColor(state.colorBall);
                }
                if (state.colorBg) {
                    window.__previewPhysics.setBgColor(state.colorBg);
                }
                if (state.radius) {
                    window.__previewPhysics.setBallSize(state.radius);
                }
            }

            // Обновляем информацию о позиции
            document.getElementById('ballPosition').textContent =
                `${Math.round(state.x || 400)}, ${Math.round(state.y || 300)}`;

            document.getElementById('ballSpeed').textContent =
                `${Math.round(state.vx || 0)}, ${Math.round(state.vy || 0)}`;

            // Обновляем статус вьювера
            if (state.viewerConnected) {
                updateStatus('viewerStatus', 'Подключен', 'connected');
            } else {
                updateStatus('viewerStatus', 'Не подключен', 'disconnected');
            }
        }

        // Быстрый тест синхронизации
        async function runQuickSyncTest() {
            log('info', '⚡ Запуск быстрого теста синхронизации (10 секунд)...');
            resetTest();
            testStartTime = Date.now();
            testDuration = 10000;

            let testStep = 0;
            const steps = [
                { name: 'Центрирование', action: () => sendCommand({ reset: true }) },
                { name: 'Горизонтальное движение', action: () => sendCommand({ resume: true, dirX: 1, dirY: 0, speedScalar: 60 }) },
                { name: 'Вертикальное движение', action: () => sendCommand({ dirX: 0, dirY: 1 }) },
                { name: 'Диагональное движение', action: () => sendCommand({ dirX: 0.707, dirY: 0.707 }) },
                { name: 'Остановка', action: () => sendCommand({ pause: true }) }
            ];

            const runStep = () => {
                if (testStep >= steps.length) {
                    finishTest();
                    return;
                }

                const step = steps[testStep];
                log('info', `📋 Шаг ${testStep + 1}: ${step.name}`);
                step.action();
                testStep++;

                setTimeout(runStep, 2000); // 2 секунды на каждый шаг
            };

            runStep();
        }

        // Тест отскоков
        async function runBounceSyncTest() {
            log('info', '🎯 Запуск теста отскоков (15 секунд)...');
            resetTest();
            testStartTime = Date.now();
            testDuration = 15000;

            // Запускаем мяч в случайном направлении с высокой скоростью
            const angle = Math.random() * Math.PI * 2;
            const dirX = Math.cos(angle);
            const dirY = Math.sin(angle);
            
            sendCommand({ 
                reset: true,
                resume: true, 
                dirX: dirX, 
                dirY: dirY, 
                speedScalar: 100 
            });

            log('info', `▶️ Мяч запущен в направлении: ${dirX.toFixed(2)}, ${dirY.toFixed(2)}`);

            // Останавливаем тест через 15 секунд
            setTimeout(() => {
                sendCommand({ pause: true });
                finishTest();
            }, 15000);
        }

        // Тест направлений
        async function runDirectionSyncTest() {
            log('info', '🧭 Запуск теста направлений (8 секунд)...');
            resetTest();
            testStartTime = Date.now();
            testDuration = 8000;

            const directions = [
                { name: 'Вправо', dirX: 1, dirY: 0 },
                { name: 'Влево', dirX: -1, dirY: 0 },
                { name: 'Вниз', dirX: 0, dirY: 1 },
                { name: 'Вверх', dirX: 0, dirY: -1 }
            ];

            let directionIndex = 0;

            const runDirection = () => {
                if (directionIndex >= directions.length) {
                    sendCommand({ pause: true });
                    finishTest();
                    return;
                }

                const direction = directions[directionIndex];
                log('info', `🧭 Направление ${directionIndex + 1}: ${direction.name}`);
                
                sendCommand({ 
                    resume: true, 
                    dirX: direction.dirX, 
                    dirY: direction.dirY, 
                    speedScalar: 70 
                });

                directionIndex++;
                setTimeout(runDirection, 2000); // 2 секунды на каждое направление
            };

            runDirection();
        }

        // Полный тест
        async function runFullSyncTest() {
            log('info', '🔬 Запуск полного теста синхронизации (30 секунд)...');
            resetTest();
            testStartTime = Date.now();
            testDuration = 30000;

            // Комбинированный тест: направления + отскоки + цвета
            const phases = [
                { name: 'Тест направлений', duration: 10000, action: runDirectionSyncTest },
                { name: 'Тест отскоков', duration: 15000, action: runBounceSyncTest },
                { name: 'Тест цветов', duration: 5000, action: testColors }
            ];

            let phaseIndex = 0;
            const runPhase = () => {
                if (phaseIndex >= phases.length) {
                    finishTest();
                    return;
                }

                const phase = phases[phaseIndex];
                log('info', `📋 Фаза ${phaseIndex + 1}: ${phase.name}`);
                phase.action();

                phaseIndex++;
                setTimeout(runPhase, phase.duration);
            };

            runPhase();
        }

        // Тест цветов
        async function testColors() {
            log('info', '🎨 Тестирование цветов...');
            
            const colors = [
                { name: 'Красный фон', colorBg: '#ff6b6b' },
                { name: 'Зеленый мяч', colorBall: '#10b981' },
                { name: 'Синий фон', colorBg: '#3b82f6' },
                { name: 'Желтый мяч', colorBall: '#f59e0b' }
            ];

            let colorIndex = 0;
            const runColor = () => {
                if (colorIndex >= colors.length) return;

                const color = colors[colorIndex];
                log('info', `🎨 ${color.name}`);
                sendCommand(color);
                colorIndex++;

                setTimeout(runColor, 1000);
            };

            runColor();
        }

        function finishTest() {
            const elapsed = (Date.now() - testStartTime) / 1000;
            log('success', `✅ Тест завершен за ${elapsed.toFixed(1)} секунд`);
            
            // Анализируем результаты
            if (bounceCount > 0) {
                log('success', `🎉 Обнаружено ${bounceCount} отскоков - синхронизация работает!`);
            } else {
                log('warning', '⚠️ Отскоки не обнаружены - проверьте настройки');
            }

            updateProgress(100);
        }

        function resetTest() {
            bounceCount = 0;
            testStartTime = 0;
            testDuration = 0;
            updateProgress(0);
            updateStatus();
            log('info', '🔄 Тест сброшен');
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function updateStatus() {
            if (testStartTime > 0 && testDuration > 0) {
                const elapsed = (Date.now() - testStartTime) / 1000;
                const progress = Math.min((elapsed / (testDuration / 1000)) * 100, 100);
                updateProgress(progress);
            }
        }

        // Отправка команд
        function sendCommand(command) {
            if (!sessionId) return;

            fetch(`/api/session/${sessionId}/controller/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(command)
            }).catch(error => {
                log('error', 'Ошибка отправки команды: ' + error.message);
            });
        }

        function log(type, message) {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            log('info', '🗑️ Лог очищен');
        }

        // Автоматический запуск быстрого теста
        setTimeout(() => {
            if (sessionId) {
                log('info', '🚀 Автоматический запуск быстрого теста...');
                runQuickSyncTest();
            }
        }, 2000);
    </script>
</body>
</html>
