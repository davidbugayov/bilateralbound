services:
  - type: web
    name: bilateralbound
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: bilateralbound-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
