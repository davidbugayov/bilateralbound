# SonarQube Configuration for Root Project
sonar.projectKey=emdr-therapy-platform
sonar.projectName=EMDR Therapy Platform
sonar.projectVersion=2.39.84

# Source directories
sonar.sources=packages/server-core/server,packages/web-client/public/js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.scannerwork/**,**/*.test.js,**/spec/**,**/webpack.config.js,**/sonar-scanner.js,**/.husky/**

# Language settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Host and authentication
sonar.host.url=http://localhost:9000



