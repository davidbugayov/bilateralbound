# SonarQube project configuration
sonar.projectKey=bilateral_bound
sonar.projectName=Bilateral Bound EMDR Therapy Tool
sonar.projectVersion=2.100.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Authentication (local SonarQube server)
sonar.token=squ_905250fe10f92ca67a2047f50eb25ca24d593d43

# Source code directories (updated for modular structure)
sonar.sources=packages/server-core/src/,packages/web-client/public/js/,packages/shared-utils/src/,packages/types/src/

# Test directories
sonar.tests=test/,packages/server-core/test/,packages/web-client/test/,packages/shared-utils/test/,packages/types/test/

# Language settings
sonar.language=js

# Exclusion patterns (updated to exclude keys and sensitive data)
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/package.json,**/*.env*,**/secrets/**,**/config*.js,**/webpack.config.js,**/nginx-config,**/deploy*.sh,**/*.log,**/qodana*/**,**/*.sarif,**/*.bak,**/*.backup

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Test inclusions
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/server-core/coverage/lcov.info,packages/web-client/coverage/lcov.info

# Documentation and Comment Rules
sonar.javascript.commentRequiredOnFunctions=true
sonar.javascript.commentRequiredOnClasses=true
sonar.javascript.commentRequiredOnParameters=true
sonar.javascript.javadoc.commentRequired=true
sonar.javascript.javadoc.all=true
sonar.javascript.javadoc.mandatory=true

# Additional useful rules for code quality
sonar.javascript.noWildCardImports=true
sonar.javascript.noUselessExpressions=true
sonar.javascript.noUnusedImports=true
sonar.javascript.noEmptyReturns=true
sonar.javascript.preferConst=true
sonar.javascript.maxAllowedComplexity=15
sonar.javascript.minimalCommentDensity=20

# Security rules to exclude sensitive files
sonar.securityHotspots.excludePatterns=**/package.json,**/*.env*,**/secrets/**,**/config*.js

# Ignore generated files and build artifacts
sonar.analysis.mode=preview
sonar.issuesReport.html.enable=true
sonar.issuesReport.json.enable=true

# Exclude vendor dependencies
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6293
sonar.issue.ignore.multicriteria.e1.resourceKey=**/node_modules/**

# Exclude test files from main code analysis
sonar.issue.ignore.multicriteria=e2
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1066
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.js

# Exclude configuration files from analysis
sonar.issue.ignore.multicriteria=e3
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S6293
sonar.issue.ignore.multicriteria.e3.resourceKey=**/package.json,**/*.env*,**/webpack.config.js,**/nginx-config

# Exclude deployment scripts
sonar.issue.ignore.multicriteria=e4
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6293
sonar.issue.ignore.multicriteria.e4.resourceKey=**/deploy*.sh,**/*.log
