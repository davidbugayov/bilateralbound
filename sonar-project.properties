# SonarQube Configuration for EMDR Bilateral Platform
sonar.projectKey=emdr-bilateral
sonar.projectName=EMDR Bilateral Platform
sonar.projectVersion=2.39.5

# Source code
sonar.sources=packages/server-core/server,packages/web-client/public/js
sonar.tests=scripts/e2e

# Exclusions - improved coverage
sonar.exclusions=**/node_modules/**,**/coverage/**,**/test-results/**,**/*.min.js,**/vendor/**,**/dist/**,**/build/**,**/public/index.html,eslint.config.js,webpack.config.js,packages/web-client/.eslintrc.js,packages/web-client/sonar-scanner.js,packages/web-client/webpack.config.js,scripts/update-version.js,jsconfig.json,**/.scannerwork/**,reports/**,docs/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# Language specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint-report.json
sonar.javascript.file.suffixes=.js

# Code coverage settings
sonar.coverage.exclusions=**/node_modules/**,scripts/**,webpack.config.js,eslint.config.js
sonar.core.codeCoveragePlugin=jacoco

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server (local Docker instance)
sonar.host.url=http://localhost:9000
sonar.token=squ_4c5f0fafcba46d0827a22d5ba95dc50cae7eb9d2

# Performance and quality gates
sonar.qualitygate.wait=true
sonar.analysis.mode=publish

