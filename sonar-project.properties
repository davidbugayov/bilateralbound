# SonarQube Configuration for Root Project
sonar.projectKey=bound
sonar.projectName=EMDR Therapy Platform
sonar.projectVersion=2.39.241

# Source directories
sonar.sources=packages/server-core/server,packages/web-client/public/js

# Test and coverage
sonar.tests=scripts/e2e
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.scannerwork/**,**/*.test.js,**/spec/**,**/webpack.config.js,**/sonar-scanner.js,**/.husky/**,**/vendor/**,**/*.bundle.js

# Language settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Host and authentication
sonar.host.url=http://localhost:9000
