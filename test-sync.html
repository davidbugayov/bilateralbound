<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тест синхронизации BilateralBound</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .test-section {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.1);
    }

    .test-section h2 {
      margin: 0 0 20px 0;
      color: #60a5fa;
      border-bottom: 2px solid #374151;
      padding-bottom: 10px;
    }

    .canvas-container {
      text-align: center;
      margin: 20px 0;
    }

    canvas {
      border: 2px solid #374151;
      border-radius: 8px;
      background: #020617;
      max-width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
      justify-content: center;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button.direction { background: #60a5fa; }
    button.start { background: #10b981; }
    button.stop { background: #f59e0b; }
    button.reset { background: #dc2626; }

    .speed-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    .speed-control input[type="range"] {
      width: 200px;
      margin: 10px 0;
    }

    .speed-value {
      font-weight: bold;
      color: #60a5fa;
      font-size: 18px;
    }

    .status {
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-weight: 500;
    }

    .status.success { background: #065f46; color: #d1fae5; }
    .status.error { background: #7f1d1d; color: #fecaca; }
    .status.info { background: #1e3a8a; color: #dbeafe; }

    .test-results {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      font-family: monospace;
      font-size: 14px;
      max-height: 300px;
      overflow-y: auto;
    }

    .test-results .success { color: #10b981; }
    .test-results .error { color: #ef4444; }
    .test-results .info { color: #60a5fa; }

    .color-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #374151;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .color-btn:hover {
      transform: scale(1.1);
      border-color: #60a5fa;
    }

    .color-btn.active {
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
    }

    .size-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .size-btn {
      padding: 8px 16px;
      background: #374151;
      color: #9ca3af;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .size-btn.active {
      background: #2563eb;
      color: white;
    }

    .sync-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background: #ef4444;
      animation: pulse 2s infinite;
    }

    .sync-indicator.synced {
      background: #10b981;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .full-width {
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="test-section">
      <h2>🎮 Контроллер</h2>
      
      <div class="controls">
        <button class="direction" onclick="setDirection('horizontal')">↔️ Горизонтально</button>
        <button class="direction" onclick="setDirection('vertical')">↕️ Вертикально</button>
        <button class="direction" onclick="setDirection('diagRL')">↖️↗️ Диагональ L→R</button>
        <button class="direction" onclick="setDirection('diagRLL')">↙️↘️ Диагональ R→L</button>
      </div>

      <div class="controls">
        <button class="start" onclick="startMovement()">▶️ Старт</button>
        <button class="stop" onclick="stopMovement()">⏸ Стоп</button>
        <button class="reset" onclick="resetBall()">🎯 Центр</button>
      </div>

      <div class="speed-control">
        <label>⚡ Скорость: <span class="speed-value" id="speedValue">40%</span></label>
        <input type="range" id="speedRange" min="0" max="100" value="40" oninput="updateSpeed(this.value)">
        <div style="display: flex; justify-content: space-between; width: 200px; font-size: 12px; color: #9ca3af;">
          <span>🐌 Медленно</span>
          <span>🐆 Быстро</span>
        </div>
      </div>

      <div class="color-controls">
        <div class="color-btn active" data-color="#60a5fa" onclick="setBallColor('#60a5fa')" style="background: #60a5fa;"></div>
        <div class="color-btn" data-color="#ef4444" onclick="setBallColor('#ef4444')" style="background: #ef4444;"></div>
        <div class="color-btn" data-color="#10b981" onclick="setBallColor('#10b981')" style="background: #10b981;"></div>
        <div class="color-btn" data-color="#f59e0b" onclick="setBallColor('#f59e0b')" style="background: #f59e0b;"></div>
        <div class="color-btn" data-color="#8b5cf6" onclick="setBallColor('#8b5cf6')" style="background: #8b5cf6;"></div>
      </div>

      <div class="size-controls">
        <button class="size-btn active" data-size="20" onclick="setBallSize(20)">Маленький</button>
        <button class="size-btn" data-size="40" onclick="setBallSize(40)">Средний</button>
        <button class="size-btn" data-size="80" onclick="setBallSize(80)">Большой</button>
      </div>

      <div class="status info">
        <span class="sync-indicator" id="controllerSync"></span>
        Статус: <span id="controllerStatus">Ожидание подключения...</span>
      </div>
    </div>

    <div class="test-section">
      <h2>👁️ Превью</h2>
      
      <div class="canvas-container">
        <canvas id="previewCanvas" width="400" height="300"></canvas>
      </div>

      <div class="status info">
        <span class="sync-indicator" id="previewSync"></span>
        Статус: <span id="previewStatus">Ожидание синхронизации...</span>
      </div>
    </div>

    <div class="test-section full-width">
      <h2>🧪 Тест синхронизации</h2>
      
      <div class="controls">
        <button onclick="runSyncTest()">🚀 Запустить тест</button>
        <button onclick="clearResults()">🗑️ Очистить результаты</button>
        <button onclick="testSpeedChange()">⚡ Тест скорости</button>
        <button onclick="testDirectionChange()">🧭 Тест направления</button>
        <button onclick="testColorChange()">🎨 Тест цвета</button>
        <button onclick="testSizeChange()">📏 Тест размера</button>
      </div>

      <div class="test-results" id="testResults">
        <div class="info">Готов к тестированию. Нажмите "Запустить тест" для начала.</div>
      </div>
    </div>
  </div>

  <script>
    // Глобальные переменные
    let sessionId = null;
    let currentDirection = { x: 1, y: 0 };
    let currentSpeed = 40;
    let currentColor = '#60a5fa';
    let currentSize = 40;
    let isMoving = false;
    let testResults = [];

    // Canvas и контекст для превью
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');

    // Инициализация
    document.addEventListener('DOMContentLoaded', async function() {
      await initializeTest();
    });

    async function initializeTest() {
      try {
        // Создаем тестовую сессию
        const response = await fetch('/api/session', { method: 'POST' });
        if (!response.ok) throw new Error('Не удалось создать сессию');
        
        const data = await response.json();
        sessionId = data.sessionId;
        
        updateStatus('controllerStatus', 'Сессия создана: ' + sessionId, 'success');
        updateStatus('previewStatus', 'Ожидание данных...', 'info');
        
        // Запускаем синхронизацию
        startSync();
        
        logTest('info', 'Тест инициализирован. SessionId: ' + sessionId);
        
      } catch (error) {
        logTest('error', 'Ошибка инициализации: ' + error.message);
        updateStatus('controllerStatus', 'Ошибка: ' + error.message, 'error');
      }
    }

    function startSync() {
      if (!sessionId) return;
      
      // Polling для синхронизации
      setInterval(async () => {
        try {
          const response = await fetch(`/api/session/${sessionId}/state`);
          if (response.ok) {
            const state = await response.json();
            updatePreview(state);
            updateSyncIndicator('previewSync', true);
            updateStatus('previewStatus', 'Синхронизировано', 'success');
          }
        } catch (error) {
          updateSyncIndicator('previewSync', false);
          updateStatus('previewStatus', 'Ошибка синхронизации', 'error');
        }
      }, 100);
    }

    function updatePreview(state) {
      if (!state) return;
      
      // Очищаем canvas
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      
      // Рисуем фон
      previewCtx.fillStyle = state.colorBg || '#020617';
      previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
      
      // Рисуем шарик
      if (state.x !== undefined && state.y !== undefined) {
        const scale = previewCanvas.width / (state.viewerScreenSize?.width || 800);
        const x = state.x * scale;
        const y = state.y * scale;
        const radius = (state.radius || 20) * scale;
        
        previewCtx.fillStyle = state.colorBall || '#60a5fa';
        previewCtx.beginPath();
        previewCtx.arc(x, y, radius, 0, 2 * Math.PI);
        previewCtx.fill();
        
        // Рисуем вектор скорости
        if (state.vx !== undefined && state.vy !== undefined) {
          const vx = state.vx * scale;
          const vy = state.vy * scale;
          const speed = Math.sqrt(vx * vx + vy * vy);
          
          if (speed > 0) {
            previewCtx.strokeStyle = '#10b981';
            previewCtx.lineWidth = 2;
            previewCtx.beginPath();
            previewCtx.moveTo(x, y);
            previewCtx.lineTo(x + vx * 0.1, y + vy * 0.1);
            previewCtx.stroke();
          }
        }
      }
    }

    // Функции управления
    function setDirection(mode) {
      let dx = 0, dy = 0;
      switch(mode) {
        case 'horizontal': dx = 1; dy = 0; break;
        case 'vertical': dx = 0; dy = 1; break;
        case 'diagRL': dx = 0.707; dy = 0.707; break;
        case 'diagRLL': dx = 0.707; dy = -0.707; break;
      }
      
      currentDirection = { x: dx, y: dy };
      sendCommand({ dirX: dx, dirY: dy });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', `Направление изменено: ${mode} (${dx}, ${dy})`);
    }

    function startMovement() {
      isMoving = true;
      sendCommand({ 
        resume: true, 
        dirX: currentDirection.x, 
        dirY: currentDirection.y,
        speedScalar: currentSpeed 
      });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', 'Движение запущено');
    }

    function stopMovement() {
      isMoving = false;
      sendCommand({ pause: true });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', 'Движение остановлено');
    }

    function resetBall() {
      sendCommand({ reset: true });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', 'Шарик сброшен в центр');
    }

    function updateSpeed(value) {
      currentSpeed = parseInt(value);
      document.getElementById('speedValue').textContent = currentSpeed + '%';
      
      if (isMoving) {
        sendCommand({ 
          speedScalar: currentSpeed,
          dirX: currentDirection.x,
          dirY: currentDirection.y
        });
      }
      
      logTest('info', `Скорость изменена: ${currentSpeed}%`);
    }

    function setBallColor(color) {
      currentColor = color;
      
      // Обновляем активную кнопку
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      sendCommand({ colorBall: color });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', `Цвет шарика изменен: ${color}`);
    }

    function setBallSize(size) {
      currentSize = size;
      
      // Обновляем активную кнопку
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      sendCommand({ radius: size });
      updateSyncIndicator('controllerSync', true);
      
      logTest('info', `Размер шарика изменен: ${size}px`);
    }

    async function sendCommand(command) {
      if (!sessionId) return;
      
      try {
        const response = await fetch(`/api/session/${sessionId}/controller/update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(command)
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        updateSyncIndicator('controllerSync', true);
        
      } catch (error) {
        logTest('error', 'Ошибка отправки команды: ' + error.message);
        updateSyncIndicator('controllerSync', false);
      }
    }

    // Функции тестирования
    function runSyncTest() {
      logTest('info', '🚀 Запуск комплексного теста синхронизации...');
      
      // Тест 1: Изменение направления
      setTimeout(() => {
        setDirection('vertical');
        logTest('info', 'Тест 1: Направление изменено на вертикальное');
      }, 1000);
      
      // Тест 2: Запуск движения
      setTimeout(() => {
        startMovement();
        logTest('info', 'Тест 2: Движение запущено');
      }, 2000);
      
      // Тест 3: Изменение скорости
      setTimeout(() => {
        updateSpeed(80);
        logTest('info', 'Тест 3: Скорость увеличена до 80%');
      }, 3000);
      
      // Тест 4: Изменение цвета
      setTimeout(() => {
        setBallColor('#ef4444');
        logTest('info', 'Тест 4: Цвет изменен на красный');
      }, 4000);
      
      // Тест 5: Изменение размера
      setTimeout(() => {
        setBallSize(80);
        logTest('info', 'Тест 5: Размер увеличен до 80px');
      }, 5000);
      
      // Тест 6: Остановка
      setTimeout(() => {
        stopMovement();
        logTest('info', 'Тест 6: Движение остановлено');
      }, 6000);
      
      // Тест 7: Сброс
      setTimeout(() => {
        resetBall();
        logTest('info', 'Тест 7: Шарик сброшен в центр');
        logTest('success', '✅ Комплексный тест завершен!');
      }, 7000);
    }

    function testSpeedChange() {
      logTest('info', '⚡ Тест изменения скорости...');
      
      const speeds = [20, 40, 60, 80, 100];
      let index = 0;
      
      const interval = setInterval(() => {
        if (index < speeds.length) {
          updateSpeed(speeds[index]);
          index++;
        } else {
          clearInterval(interval);
          logTest('success', '✅ Тест скорости завершен');
        }
      }, 500);
    }

    function testDirectionChange() {
      logTest('info', '🧭 Тест изменения направления...');
      
      const directions = ['horizontal', 'vertical', 'diagRL', 'diagRLL'];
      let index = 0;
      
      const interval = setInterval(() => {
        if (index < directions.length) {
          setDirection(directions[index]);
          index++;
        } else {
          clearInterval(interval);
          logTest('success', '✅ Тест направления завершен');
        }
      }, 800);
    }

    function testColorChange() {
      logTest('info', '🎨 Тест изменения цвета...');
      
      const colors = ['#60a5fa', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'];
      let index = 0;
      
      const interval = setInterval(() => {
        if (index < colors.length) {
          setBallColor(colors[index]);
          index++;
        } else {
          clearInterval(interval);
          logTest('success', '✅ Тест цвета завершен');
        }
      }, 600);
    }

    function testSizeChange() {
      logTest('info', '📏 Тест изменения размера...');
      
      const sizes = [20, 40, 80];
      let index = 0;
      
      const interval = setInterval(() => {
        if (index < sizes.length) {
          setBallSize(sizes[index]);
          index++;
        } else {
          clearInterval(interval);
          logTest('success', '✅ Тест размера завершен');
        }
      }, 700);
    }

    // Вспомогательные функции
    function updateStatus(elementId, text, type) {
      const element = document.getElementById(elementId);
      if (element) {
        element.textContent = text;
        element.className = `status ${type}`;
      }
    }

    function updateSyncIndicator(elementId, synced) {
      const element = document.getElementById(elementId);
      if (element) {
        element.className = `sync-indicator ${synced ? 'synced' : ''}`;
      }
    }

    function logTest(type, message) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = type;
      logEntry.textContent = `[${timestamp}] ${message}`;
      
      const results = document.getElementById('testResults');
      results.appendChild(logEntry);
      results.scrollTop = results.scrollHeight;
      
      testResults.push({ type, message, timestamp });
    }

    function clearResults() {
      const results = document.getElementById('testResults');
      results.innerHTML = '<div class="info">Результаты очищены.</div>';
      testResults = [];
    }

    // Автоматическое обновление индикаторов синхронизации
    setInterval(() => {
      if (sessionId) {
        updateSyncIndicator('controllerSync', false);
        updateSyncIndicator('previewSync', false);
      }
    }, 3000);
  </script>
</body>
</html>
