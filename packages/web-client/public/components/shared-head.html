<!-- Централизованный HTML head компонент для BilateralBound -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<!-- SEO Meta Tags -->
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}" />
<meta name="keywords" content="{{metaKeywords}}" />
<meta name="author" content="Bugaev David" />
<meta name="robots" content="{{metaRobots}}" />
<meta name="language" content="Russian" />
<meta name="theme-color" content="{{themeColor}}" />

<!-- EMDR Specific Meta Tags -->
<meta name="therapy-type" content="{{therapyType}}" />
<meta name="target-audience" content="{{targetAudience}}" />

<!-- Preload critical resources -->
<link rel="preload" href="/js/common.js" as="script" />
<link rel="preload" href="/css/shared-components.css" as="style" />
<link rel="preload" href="/css/light-theme.css" as="style" />

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{faviconSvg}}" />
<link rel="icon" type="image/x-icon" href="{{faviconIco}}" />
<link rel="apple-touch-icon" href="{{faviconSvg}}" />
<link rel="shortcut icon" href="{{faviconIco}}" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ogTitle}}" />
<meta property="og:description" content="{{ogDescription}}" />
<meta property="og:image" content="{{ogImage}}" />
<meta property="og:url" content="{{ogUrl}}" />
<meta property="og:site_name" content="BilateralBound" />
<meta property="og:locale" content="ru_RU" />
<meta property="article:author" content="Bugaev David" />
<meta property="article:section" content="Mental Health, Therapy" />
<meta property="article:tag" content="EMDR терапия" />
<meta property="article:tag" content="биодинамическая стимуляция" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{twitterTitle}}" />
<meta name="twitter:description" content="{{twitterDescription}}" />
<meta name="twitter:image" content="{{twitterImage}}" />
<meta name="twitter:site" content="@bilateralbound" />
<meta name="twitter:creator" content="@bilateralbound" />

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["WebApplication", "MedicalTherapy", "VideoGame"],
    "name": "{{structuredDataName}}",
    "description": "{{structuredDataDescription}}",
    "url": "{{structuredDataUrl}}",
    "applicationCategory": ["HealthcareApplication", "GameApplication"],
    "operatingSystem": "Web Browser",
    "medicalSpecialty": "Psychiatry",
    "therapyType": "EMDR",
    "targetPopulation": "Couples, Individuals",
    "genre": "Therapeutic Game",
    "author": {
      "@type": "Organization",
      "name": "BilateralBound Team",
      "medicalSpecialty": "Mental Health"
    },
    "provider": {
      "@type": ["MedicalOrganization", "GameDeveloper"],
      "name": "BilateralBound",
      "medicalSpecialty": "Psychiatry",
      "serviceType": ["EMDR Therapy", "Therapeutic Gaming"]
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "RUB",
      "description": "{{offersDescription}}"
    }
  }
</script>

<!-- Stylesheets -->
<link rel="stylesheet" href="/css/shared-components.css" />
<link rel="stylesheet" href="/css/light-theme.css" />
