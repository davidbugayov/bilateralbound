<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <radialGradient id="pupilGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </radialGradient>
  </defs>

  <!-- Фон для лучшей видимости -->
  <rect width="32" height="32" fill="#ffffff" rx="4"/>

  <!-- Внешний контур глаза -->
  <ellipse cx="16" cy="16" rx="13" ry="7.5" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Радужка -->
  <circle cx="16" cy="16" r="7" fill="url(#eyeGradient)"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.3"/>

  <!-- Зрачок -->
  <circle cx="16" cy="16" r="3" fill="url(#pupilGradient)"/>

  <!-- Блик -->
  <circle cx="19" cy="13" r="1.5" fill="#ffffff"/>
  <circle cx="20" cy="12" r="0.8" fill="#ffffff" opacity="0.8"/>

  <!-- Ресницы -->
  <line x1="5" y1="12" x2="7" y2="9" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="12" x2="25" y2="9" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="14" x2="6" y2="12" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="29" y1="14" x2="26" y2="12" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
</svg>

