  <body>
    <main class="viewer-container">
      <header>
        <div id="statusContainer" aria-live="polite"></div>
        <div
          class="viewer-audio-container hidden"
          id="viewerAudioControls"
          style="display: none; align-items: center; gap: 10px"
        >
          <div style="display: flex; align-items: center; gap: 6px; opacity: 0.85">
            <span style="font-size: 1rem">🔊</span>
            <input
              aria-label="Volume"
              id="viewerVolumeSlider"
              max="100"
              min="0"
              style="width: 70px; cursor: pointer; accent-color: #60a5fa"
              type="range"
              value="50"
            />
          </div>
          <!-- CSS-based Bilateral Audio Frequency Visualizer Bar -->
          <div
            id="audioVisualizerBar"
            class="audio-visualizer-bar"
            role="status"
            aria-label="Bilateral Audio Frequency Visualizer"
          >
            <div
              class="visualizer-channel visualizer-channel--left"
              data-channel="left"
              title="Left bilateral audio channel"
            >
              <span class="channel-lbl">L</span>
              <div class="channel-bars">
                <span class="vbar vbar--1" style="--bar-h: 4px"></span>
                <span class="vbar vbar--2" style="--bar-h: 5px"></span>
                <span class="vbar vbar--3" style="--bar-h: 4px"></span>
                <span class="vbar vbar--4" style="--bar-h: 3px"></span>
                <span class="vbar vbar--5" style="--bar-h: 2px"></span>
              </div>
            </div>

            <div class="visualizer-center-meter">
              <div class="visualizer-wave">
                <span class="wave-pulse"></span>
              </div>
              <div
                class="visualizer-freq"
                title="Active Bilateral Audio Frequency"
              >
                <span class="freq-val" id="viewerVisualizerFreqVal">180</span
                ><span class="freq-unit">Hz</span>
              </div>
            </div>

            <div
              class="visualizer-channel visualizer-channel--right"
              data-channel="right"
              title="Right bilateral audio channel"
            >
              <div class="channel-bars">
                <span class="vbar vbar--5" style="--bar-h: 2px"></span>
                <span class="vbar vbar--4" style="--bar-h: 3px"></span>
                <span class="vbar vbar--3" style="--bar-h: 4px"></span>
                <span class="vbar vbar--2" style="--bar-h: 5px"></span>
                <span class="vbar vbar--1" style="--bar-h: 4px"></span>
              </div>
              <span class="channel-lbl">R</span>
            </div>
          </div>
        </div>
        <button
          id="hapticsToggleBtn"
          class="haptics-btn"
          onclick="toggleHaptics()"
          data-i18n-attr="aria-label:viewer.haptics"
          data-i18n="viewer.haptics"
          style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 14px;"
        >
          📳 Вибрация
        </button>
        <!-- Ambient Sound Picker -->
        <div class="ambient-picker" id="ambientPicker">
          <button
            id="ambientToggleBtn"
            class="ambient-btn"
            onclick="toggleAmbientMenu()"
            title="Ambient Background Sound"
            style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 14px;"
          >
            🎵 Фон
          </button>
          <div class="ambient-menu" id="ambientMenu" style="display:none; position:absolute; top:48px; right:120px; background:rgba(20,20,35,0.95); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:8px; z-index:999; min-width:160px; backdrop-filter:blur(12px);">
            <div style="font-size:11px; color:rgba(255,255,255,0.5); padding:4px 8px 8px;">Background Sound</div>
            <button class="ambient-opt" onclick="setAmbient('none')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">✕ Off</button>
            <button class="ambient-opt" onclick="setAmbient('rain')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">🌧️ Rain</button>
            <button class="ambient-opt" onclick="setAmbient('ocean')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">🌊 Ocean</button>
            <button class="ambient-opt" onclick="setAmbient('forest')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">🌿 Forest</button>
            <button class="ambient-opt" onclick="setAmbient('whitenoise')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">⬜ White Noise</button>
            <button class="ambient-opt" onclick="setAmbient('binaural')" style="display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px;">🧠 Binaural 10Hz</button>
            <div style="padding: 6px 10px 2px; border-top: 1px solid rgba(255,255,255,0.1); margin-top:4px;">
              <label style="font-size:11px; color:rgba(255,255,255,0.5); display:block; margin-bottom:4px;">Volume</label>
              <input type="range" min="0" max="100" value="30" style="width:100%; accent-color:#7c6cf7;" oninput="setAmbientVolume(this.value)" />
            </div>
          </div>
        </div>
        <button
          class="fullscreen-btn"
          onclick="toggleFullscreen()"
          data-i18n-attr="aria-label:viewer.fullscreen"
          data-i18n="viewer.fullscreen"
        >
          ⛶ Полноэкранный
        </button>
      </header>
      <canvas id="viewerCanvas" class="viewer-canvas">
        <p class="sr-only" data-i18n="viewer.description">
          Анимация движущегося шарика для EMDR-терапии.
        </p>
      </canvas>
      <div
        aria-live="polite"
        class="loading"
        data-i18n="viewer.loading"
        id="loading"
      >
        Loading...
      </div>
      <div id="hotkeysHint" class="hotkeys-hint">
        <div class="hotkeys-row">
          <kbd>Space</kbd>
          <span data-i18n="viewer.hotkeysHint">— Start/Stop</span>
        </div>
        <div class="hotkeys-row">
          <kbd>Esc</kbd>
          <span data-i18n="viewer.hotkeysEscHint">— Fullscreen</span>
        </div>
      </div>
      <div id="unmuteOverlay" class="unmute-overlay hidden">
        <button id="unmuteBtn" class="unmute-btn">
          <span>🔊</span>
          <span data-i18n="viewer.enableSound">Enable sound</span>
        </button>
      </div>
      <div id="errorBar" class="error-bar hidden" role="alert">
        <div class="error-bar-icon">⚠️</div>
        <div class="error-bar-content">
          <div class="error-bar-title" id="errorBarTitle"></div>
          <div class="error-bar-message" id="errorBarMessage"></div>
        </div>
        <div class="error-bar-actions">
          <button
            class="error-bar-btn"
            id="errorBarRetry"
            style="display: none"
            data-i18n="viewer.retry"
          >
            Retry
          </button>
          <button
            class="error-bar-btn error-bar-close"
            aria-label="Close"
            data-i18n-attr="aria-label:common.close"
            onclick="
              document.getElementById('errorBar').classList.add('hidden')
            "
          >
            ×
          </button>
        </div>
      </div>
      <div
        id="errorStatesContainer"
        class="error-states-container"
        role="alert"
        aria-live="polite"
      ></div>
    </main>
    <script src="/js/ui/hint-banner.js?v=2.39.828-f326c70c" defer></script>
    <script src="/js/ui/error-states.js?v=2.39.828-f326c70c" defer></script>
    <script src="/js/ambient-audio.js" defer></script>
    <script src="/dist/shared.bundle.js?v=2.39.828-f326c70c" defer></script>
    <script src="/dist/viewer.bundle.js?v=2.39.828-f326c70c" defer></script>
  </body>
</html>
