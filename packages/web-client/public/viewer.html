<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta

    <meta name="apple-mobile-web-app-capable" content="yes" />

      content="EMDR терапия вьювер - наблюдение за биодинамической стимуляцией. Инструмент для пациентов при проведении EMDR терапии онлайн"
    />
    <meta
      name="keywords"

    <!-- EMDR Specific Meta Tags -->
    <meta name="therapy-type" content="EMDR Viewer" />
    <meta name="target-audience" content="EMDR Patients, Couples" />

    <!-- Favicon for Viewer (Eye Icon) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-viewer.svg?v=202509031200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon-viewer.ico?v=202509031200"
    />
    <link rel="apple-touch-icon" href="/favicon-viewer.svg?v=202509031200" />
    <link rel="shortcut icon" href="/favicon-viewer.ico?v=202509031200" />

    <!-- Open Graph for Viewer -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="BilateralBound - EMDR терапия для пациентов"
    />
    <meta
      property="og:description"
      content="EMDR терапия вьювер для наблюдения за биодинамической стимуляцией в парной терапии"
    />
    <meta property="article:tag" content="EMDR терапия" />
    <meta property="article:tag" content="биодинамическая стимуляция" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/js/common.js" as="script" />
    <link rel="preload" href="/css/shared-components.css" as="style" />
    <link rel="preload" href="/css/light-theme.css" as="style" />
    <link rel="preload" href="/css/viewer.css" as="style" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/shared-components.css" />
    <link rel="stylesheet" href="/css/light-theme.css" />
    <link rel="stylesheet" href="/css/viewer.css" />

    <!-- Yandex.Metrika optimized counter -->
    <noscript
      ><div>
        <img
          src="https://mc.yandex.ru/watch/104698530"
          style="position: absolute; left: -9999px"
          alt=""
        /></div
    ></noscript>
    <!-- /Yandex.Metrika optimized counter -->
  </head>
  <body>
    <main class="viewer-container">
      <header>
        <div id="statusContainer" aria-live="polite"></div>
        <button
          class="fullscreen-btn"
          onclick="toggleFullscreen()"
          aria-label="Переключить полноэкранный режим"
        >
          ⛶ Полноэкранный
        </button>
      </header>
      <canvas id="viewerCanvas" class="viewer-canvas">
        <p class="sr-only">Анимация движущегося шарика для EMDR-терапии.</p>
      </canvas>
      <div id="loading" class="loading" aria-live="polite">Загрузка...</div>

      <!-- Unmute Overlay for Audio -->
      <div id="unmuteOverlay" class="unmute-overlay hidden">
        <button id="unmuteBtn" class="unmute-btn">
          <span>🔊</span>
          <span>Включить звук</span>
        </button>
      </div>
    </main>

    <script src="/js/common.js" defer></script>
    <script src="/js/audio/audio-manager.js?v=1.0.0" defer></script>
    <script src="/js/physics-engine.js" defer></script>
    <script src="/js/renderer.js" defer></script>
    <script src="/js/websocket-client.js" defer></script>
    <script src="/js/shared-components.js" defer></script>

    <script>
      "use strict";

      /**
       * @typedef {Object} StatusIndicatorComponent
       * @property {function(string, string): void} setStatus - Устанавливает статус индикатора
       */

      // Global variables
      let wsClient;
      let physicsEngine;
      let ballRenderer;
      let isFullscreen = false;
      let audioManager = null;
      let audioActivated = false;
      /** @type {Object} */
      const components = {};
      // components.status will be assigned in initializeComponents() and has setStatus method
      let resizeTimeout = null;
      let lastScreenSizeUpdate = 0;

      // Initialize on DOM load
      document.addEventListener("DOMContentLoaded", async function () {
        try {
          const sessionId = getSessionIdFromUrl();
          if (!sessionId) {
            showError("Session ID не найден в URL");
            return;
          }

          debugLog("📱 Session ID получен:", sessionId);
          initializeComponents();
          await initializeViewer(sessionId);
        } catch (error) {
          debugError("❌ Критическая ошибка инициализации:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      });

      function initializeComponents() {
        components.status = sharedComponents.createStatusIndicator(
          document.getElementById("statusContainer"),
          {
            title: "Подключение...",
            showIcon: true,
            autoHide: false,
          },
        );
        // JSDoc для IDE: components.status имеет метод setStatus

        // Initialize Audio Manager (с задержкой если еще не загружен)
        if (typeof AudioManager !== 'undefined') {
          initAudioManager();
        } else {
          // Ждем загрузки AudioManager
          const checkAudioManager = setInterval(() => {
            if (typeof AudioManager !== 'undefined') {
              clearInterval(checkAudioManager);
              initAudioManager();
              debugLog('🔊 AudioManager loaded and initialized');
            }
          }, 100);
          // Таймаут на случай если AudioManager не загрузится
          setTimeout(() => clearInterval(checkAudioManager), 5000);
        }
      }

      function initAudioManager() {
        if (typeof AudioManager === 'undefined') {
          debugWarn('AudioManager not loaded yet');
          return;
        }

        audioManager = new AudioManager();

        // Setup user gesture handlers for audio activation
        const activateAudio = () => {
          if (!audioActivated) {
            audioManager.init();
            audioActivated = true;
            checkAudioOverlay();
            debugLog('🔊 Audio activated by user gesture');
          }
        };

        document.addEventListener('click', activateAudio, { once: true });
        document.addEventListener('touchstart', activateAudio, { once: true });

        const unmuteBtn = document.getElementById('unmuteBtn');
        if (unmuteBtn) {
          unmuteBtn.addEventListener('click', activateAudio);
          unmuteBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            activateAudio();
          });
        }
      }

      function checkAudioOverlay() {
        const overlay = document.getElementById('unmuteOverlay');
        if (!overlay) return;

        // Show overlay when sound is enabled from controller but not activated by user
        const shouldShow = audioManager && audioManager.enabled && !audioActivated;

        debugLog('🔊 checkAudioOverlay:', {
          enabled: audioManager?.enabled,
          activated: audioActivated,
          shouldShow
        });

        if (shouldShow) {
          overlay.classList.remove('hidden');
        } else {
          overlay.classList.add('hidden');
        }
      }

      function onBounce(side, dirX, dirY) {
        // Play audio tick on bounce
        if (audioManager && audioManager.enabled && audioActivated) {
          audioManager.playTick();
        }

        // Send bounce to server via WebSocket
        if (wsClient) {
          wsClient.send('bounce', {
            side: side,
            dirX: dirX || 0,
            dirY: dirY || 0,
            timestamp: Date.now()
          }).catch(err => {
            debugWarn('Failed to send bounce:', err);
          });
        }
      }

      async function initializeViewer(sessionId) {
        try {
          debugLog("📱 Инициализация viewer для сессии:", sessionId);
          hideLoading();

          if (!globalThis.__current) {
            globalThis.__current = {};
          }
          globalThis.__current.sessionId = sessionId;

          const canvas = document.getElementById("viewerCanvas");
          if (!canvas) {
            console.error("Canvas не найден");
            return;
          }

          resizeCanvas();

          // Create bounce callback for audio
          const bounceCallback = (bounceData) => {
            onBounce(bounceData.side, bounceData.dirX, bounceData.dirY);
          };

          physicsEngine = new PhysicsEngine({
            worldWidth: globalThis.innerWidth,
            worldHeight: globalThis.innerHeight,
            isViewer: true,
            bounceCallback: bounceCallback,
          });
          globalThis.physicsEngine = physicsEngine;

          ballRenderer = new BallRenderer(canvas, physicsEngine, {
            localPhysics: false,
          });

          await connectToSession(sessionId);

          wsClient = new WebSocketClient(sessionId, "viewer");
          globalThis.wsClient = wsClient;

          wsClient.on(WS_MSG.initialState, (state) => {
            debugLog("✅ Получено начальное состояние", state);
            physicsEngine.applyCommand(state);
            if (state && state.paused === false) {
              physicsEngine.setPaused(false);
            }
            // Handle audio settings from initial state
            if (audioManager) {
              if (typeof state.soundEnabled === 'boolean') {
                audioManager.setEnabled(state.soundEnabled);
                checkAudioOverlay();
              }
              if (state.soundType) {
                audioManager.setSoundType(state.soundType);
              }
            }
            updateStatus(state);
          });

          wsClient.on(WS_MSG.stateUpdate, (command) => {
            physicsEngine.applyCommand(command);
            if (command && command.paused === false) {
              physicsEngine.setPaused(false);
            }
            // Handle audio settings
            if (audioManager) {
              if (typeof command.soundEnabled === 'boolean') {
                audioManager.setEnabled(command.soundEnabled);
                checkAudioOverlay();
              }
              if (command.soundType) {
                audioManager.setSoundType(command.soundType);
              }
            }
            // НЕ обновляем статус контроллера при обновлениях состояния мяча
            // updateStatus(command);
          });

          // Обработчик для события подключения контроллера
          wsClient.on("controller_connected", (data) => {
            debugLog("🔌 Контроллер подключился:", data);
            updateStatus(data);
          });

          wsClient.on("controller_disconnected", (data) => {
            debugLog("🔌 Контроллер отключился:", data);
            updateStatus(data);
          });

          wsClient.on("open", () => {
            debugLog("✅ WebSocket connection established.");
            components.status.setStatus("success", "Соединение установлено");
            // Запрашиваем текущее состояние подключения контроллера
            wsClient
              .send("get_controller_status", {})
              .catch((error) =>
                debugWarn("Не удалось запросить статус контроллера:", error),
              );

            // Уведомляем сервер о подключении вьювера
            wsClient.send("viewer_connected", {
              timestamp: Date.now(),
              sessionId: sessionId,
              role: "viewer",
            });
          });

          wsClient.on("close", () => {
            debugWarn("🔌 WebSocket connection closed.");
            showError("Соединение потеряно. Попытка переподключения...");
          });

          wsClient.on("error", (error) => {
            debugError("❌ WebSocket error:", error);
            showError("Ошибка соединения.");
          });

          // Обработчик для получения статуса контроллера
          wsClient.on("controller_status", (status) => {
            debugLog("📊 Статус контроллера:", status);
            updateStatus(status);
          });

          await wsClient.connect();

          // Physics and render loops
          const PHYSICS_TICK_RATE = 60;
          const PHYSICS_DT = 1000 / PHYSICS_TICK_RATE;
          let lastPhysicsUpdateTs = performance.now();

          function physicsLoop() {
            if (physicsEngine) {
              physicsEngine.update(PHYSICS_DT / 1000);
              lastPhysicsUpdateTs = performance.now();
            }
          }

          function renderLoop() {
            if (!physicsEngine || !ballRenderer) {
              requestAnimationFrame(renderLoop);
              return;
            }

            const now = performance.now();
            const alpha = Math.max(
              0,
              Math.min(1, (now - lastPhysicsUpdateTs) / PHYSICS_DT),
            );

            const interpolatedState = physicsEngine.getInterpolatedBall(alpha);
            ballRenderer.drawFrame(interpolatedState);
            requestAnimationFrame(renderLoop);
          }

          setInterval(physicsLoop, PHYSICS_DT);
          requestAnimationFrame(renderLoop);
          setupEventListeners();

          debugLog("✅ Viewer успешно инициализирован");
        } catch (error) {
          debugError("❌ Ошибка инициализации viewer:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      }

      async function connectToSession(sessionId) {
        try {
          const canvasElement = document.getElementById("viewerCanvas");
          if (!canvasElement) {
            console.error("Canvas не найден");
            return;
          }

          const response = await fetch(
            `/api/session/${sessionId}/viewer/connect`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                screenSize: {
                  width: globalThis.innerWidth,
                  height: globalThis.innerHeight,
                },
              }),
            },
          );

          if (!response.ok) {
            const errorText = await response.text();
            // Исправлено: убрали throw из try-catch для избежания ошибки
            const errorMessage = `HTTP ${response.status}: ${errorText || "Не удалось подключиться к сессии"}`;
            debugError("❌ Ошибка подключения к сессии:", errorMessage);
            showError(errorMessage);
            return;
          }

          debugLog("✅ Подключение к сессии успешно");
        } catch (error) {
          debugError("❌ Ошибка подключения к сессии:", error);
          showError("Ошибка подключения: " + error.message);
        }
      }

      function resizeCanvas() {
        const canvas = document.getElementById("viewerCanvas");
        if (!canvas) return;

        canvas.width = globalThis.innerWidth;
        canvas.height = globalThis.innerHeight;

        if (physicsEngine) {
          physicsEngine.setWorldSize(canvas.width, canvas.height);
        }

        if (ballRenderer) {
          ballRenderer.resize(canvas.width, canvas.height);
        }
      }

      async function updateScreenSize() {
        const sessionId = getSessionIdFromUrl();
        if (!sessionId) return;

        try {
          const now = Date.now();
          if (now - lastScreenSizeUpdate < 2000) {
            return;
          }

          const response = await fetch(
            `/api/session/${sessionId}/viewer/screen-size`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                width: globalThis.innerWidth,
                height: globalThis.innerHeight,
              }),
              signal: AbortSignal.timeout(5000),
            },
          );

          if (!response.ok) {
            const errorText = await response.text();
            const errorMessage = `HTTP ${response.status}: ${errorText || "Неизвестная ошибка"}`;
            showWarning(`Не удалось обновить размер экрана: ${errorMessage}`);
            return;
          }

          lastScreenSizeUpdate = now;
          debugLog(
            `✅ Размер экрана обновлен на сервере: ${globalThis.innerWidth}×${globalThis.innerHeight}`,
          );
        } catch (error) {
          if (error.name === "AbortError") {
            debugLog("⏰ Таймаут при обновлении размера экрана");
          } else if (
            error.name === "TypeError" &&
            error.message.includes("fetch")
          ) {
            debugLog("🌐 Сеть недоступна при обновлении размера экрана");
          } else {
            debugError("Ошибка при обновлении размера экрана:", error);
          }
        }
      }

      function updateStatus(sessionData) {
        if (components.status) {
          debugLog("📊 Обновление статуса:", sessionData);

          // Проверяем наличие данных о подключении контроллера
          if (sessionData.controllerConnected === true) {
            components.status.setStatus("success", "Контроллер подключен");
            debugLog("✅ Статус обновлен: Контроллер подключен");
          } else if (sessionData.controllerConnected === false) {
            components.status.setStatus("error", "Контроллер отключен");
            debugLog("❌ Статус обновлен: Контроллер отключен");
          } else {
            // Если данных о контроллере нет, используем статус WebSocket соединения
            const isWebSocketConnected = wsClient && wsClient.isConnected;
            if (isWebSocketConnected) {
              components.status.setStatus(
                "success",
                "Соединение установлено, ожидание контроллера...",
              );
              debugLog("⏳ Статус обновлен: Ожидание контроллера");
            } else {
              components.status.setStatus("error", "Контроллер отключен");
              debugLog(
                "❌ Статус обновлен: Контроллер отключен (нет WebSocket)",
              );
            }
          }
        }
      }

      function showError(message) {
        if (components.status) {
          components.status.setStatus("error", message);
        }
      }

      function showWarning(message) {
        debugWarn("⚠️ Предупреждение viewer:", message);
      }

      function hideLoading() {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.display = "none";
        }
      }

      // Fullscreen & Mobile
      let screenWakeLock = null;

      async function requestScreenWakeLock() {
        try {
          if (
            "wakeLock" in navigator &&
            document.visibilityState === "visible"
          ) {
            screenWakeLock = await navigator.wakeLock.request("screen");
            screenWakeLock.addEventListener("release", () => {
              debugLog("🔓 Wake Lock released");
            });
            debugLog("🔒 Wake Lock acquired");
          }
        } catch (e) {
          debugWarn("Wake Lock not available:", e?.message || e);
        }
      }

      async function releaseScreenWakeLock() {
        try {
          if (screenWakeLock) {
            await screenWakeLock.release();
            screenWakeLock = null;
          }
        } catch (error) {
          debugError("Could not release screen wake lock:", error);
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && isFullscreen) {
          requestScreenWakeLock();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        isFullscreen = !!(
          document.fullscreenElement ||
          document["webkitFullscreenElement"] ||
          document["msFullscreenElement"] ||
          document["mozFullScreenElement"]
        );
        const btn = document.querySelector(".fullscreen-btn");
        if (btn) {
          btn.textContent = isFullscreen ? "⛶ Выйти" : "⛶ Полноэкранный";
        }
        if (isFullscreen) {
          requestScreenWakeLock();
        } else {
          releaseScreenWakeLock();
        }
      });

      // Double tap for fullscreen
      let lastTap = 0;
      document
        .getElementById("viewerCanvas")
        .addEventListener("touchend", function (event) {
          const currentTime = Date.now();
          if (currentTime - lastTap < 300) {
            event.preventDefault();
            toggleFullscreen();
          }
          lastTap = currentTime;
        });

      function setupEventListeners() {
        if (globalThis) {
          globalThis.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
              resizeCanvas();
              updateScreenSize().catch(() => {
                debugLog("Размер экрана не обновлен (сеть недоступна)");
              });
            }, 1500);
          });
        }

        if (document) {
          document.addEventListener("gesturestart", (event) =>
            event.preventDefault(),
          );
          document.addEventListener("gesturechange", (event) =>
            event.preventDefault(),
          );
          document.addEventListener("gestureend", (event) =>
            event.preventDefault(),
          );
        }
      }
    </script>
  </body>
</html>
