    <!-- Debug Logger - Load first without defer -->

    <!-- Common utilities - Required for getSessionIdFromUrl -->

    <script src="/js/audio/audio-manager.js?v=2.39.10-e19c954" defer></script>
    <script src="/js/physics-engine.js?v=2.39.10-e19c954" defer></script>
    <script src="/js/renderer.js?v=2.39.10-e19c954" defer></script>
    <script src="/js/websocket-client.js?v=2.39.10-e19c954" defer></script>
    <script src="/js/shared-components.js?v=2.39.10-e19c954" defer></script>

    <script>
      "use strict";

      /**
       * @typedef {Object} StatusIndicatorComponent
       * @property {function(string, string): void} setStatus - Устанавливает статус индикатора
       */

      // Global variables
      let wsClient;
      let physicsEngine;
      let ballRenderer;
      let isFullscreen = false;
      let audioManager = null;
      // audioActivated начинается с false и обновляется только на основе контроллера
      // НЕ восстанавливаем из localStorage при инициализации - это вызывает проблемы
      // localStorage используется только для сохранения между сессиями пользователя
      let audioActivated = false;
      /** @type {Object} */
      const components = {};
      // components.status will be assigned in initializeComponents() and has setStatus method
      let resizeTimeout = null;
      let lastScreenSizeUpdate = 0;

      // Expose to window for debugging
      if (typeof window !== 'undefined') {
        window.audioManager = audioManager;
        window.audioActivated = audioActivated;
        // Функция для сброса состояния активации аудио (для отладки)
        window.resetAudioActivation = function() {
          localStorage.removeItem('bb_audioActivated');
          audioActivated = false;
          window.audioActivated = false;
          if (audioManager) {
            checkAudioOverlay();
          }
          console.log('🔊 Audio activation state reset. Reload page to see unmute overlay again.');
        };
      }

      // Initialize on DOM load
      document.addEventListener("DOMContentLoaded", async function () {
        debugLog('🚀 DOMContentLoaded fired');
        debugLog('🔊 Audio activation state restored from localStorage:', audioActivated);
        debugLog('🚀 Доступные глобальные объекты:', {
          AudioManager: typeof AudioManager,
          PhysicsEngine: typeof PhysicsEngine,
          BallRenderer: typeof BallRenderer,
          WebSocketClient: typeof WebSocketClient,
          sharedComponents: typeof sharedComponents
        });

        try {
          const sessionId = getSessionIdFromUrl();
          if (!sessionId) {
            showError("Session ID не найден в URL");
            return;
          }

          debugLog("📱 Session ID получен:", sessionId);
          initializeComponents();
          await initializeViewer(sessionId);
        } catch (error) {
          debugError("❌ Критическая ошибка инициализации:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      });

      function initializeComponents() {
        debugLog('📦 initializeComponents вызван');

        components.status = sharedComponents.createStatusIndicator(
          document.getElementById("statusContainer"),
          {
            title: "Подключение...",
            showIcon: true,
            autoHide: false,
          },
        );
        debugLog('📦 Status indicator создан');

        // Initialize Audio Manager (с задержкой если еще не загружен)
        debugLog('🔊 Проверка AudioManager:', typeof AudioManager);

        if (typeof AudioManager !== 'undefined') {
          debugLog('🔊 AudioManager доступен, инициализируем сразу');
          initAudioManager();
        } else {
          debugLog('🔊 AudioManager еще не загружен, ждем...');
          let attempts = 0;
          // Ждем загрузки AudioManager
          const checkAudioManager = setInterval(() => {
            attempts++;
            debugLog(`🔊 Попытка ${attempts}/50 найти AudioManager:`, typeof AudioManager);

            if (typeof AudioManager !== 'undefined') {
              clearInterval(checkAudioManager);
              debugLog('🔊 AudioManager загружен, инициализируем');
              initAudioManager();
            }
          }, 100);

          // Таймаут на случай если AudioManager не загрузится
          setTimeout(() => {
            clearInterval(checkAudioManager);
            if (typeof AudioManager === 'undefined') {
              debugError('❌ AudioManager не загрузился за 5 секунд!');
            }
          }, 5000);
        }
      }

      function initAudioManager() {
        if (typeof AudioManager === 'undefined') {
          debugWarn('AudioManager not loaded yet');
          return;
        }

        audioManager = new AudioManager();
        window.audioManager = audioManager; // Expose for debugging
        if (typeof logger !== 'undefined') {
          logger.audio('AudioManager создан, enabled:', audioManager.enabled);
        }

        // НЕ инициализируем audio из localStorage автоматически
        // Audio будет инициализирован только когда:
        // 1. Контроллер включит звук (soundEnabled=true)
        // 2. И пользователь сделает какой-то жест (клик/касание)
        // Это гарантирует что audio не будет инициализирован если контроллер отключил звук

        // Setup user gesture handlers for audio activation
        const activateAudio = () => {
          debugLog('🔘 [activateAudio] Функция вызвана');
          debugLog('🔘 audioManager:', audioManager);
          debugLog('🔘 audioActivated:', audioActivated);

          // Проверяем что audioManager существует
          if (!audioManager) {
            debugWarn('❌ [activateAudio] audioManager не инициализирован!');
            return;
          }

          debugLog('🔘 [activateAudio] audioManager существует, инициализируем...');

          // Инициализируем AudioContext
          audioManager.init();
          debugLog('✅ [activateAudio] audioManager.init() вызван');

          // Устанавливаем флаг активации
          audioActivated = true;
          window.audioActivated = true;
          localStorage.setItem('bb_audioActivated', 'true');
          debugLog('✅ [activateAudio] audioActivated установлен на true');

          // Обновляем UI - скрываем кнопку
          debugLog('🔘 [activateAudio] Вызываем checkAudioOverlay()...');
          checkAudioOverlay();
          debugLog('✅ [activateAudio] checkAudioOverlay() вызван');

          if (typeof logger !== 'undefined') {
            logger.audio('✅ Audio activated by user gesture - кнопка нажата!');
          }

          // Отправляем на сервер что зритель активировал звук
          const sendActivationNotification = () => {
            const sessionId = getSessionIdFromUrl();
            debugLog('📤 [sendActivationNotification] sessionId:', sessionId);
            debugLog('📤 [sendActivationNotification] wsClient:', !!wsClient);
            debugLog('📤 [sendActivationNotification] wsClient.send:', typeof wsClient?.send);
            debugLog('📤 [sendActivationNotification] WS_MSG.viewerAudioActivated:', WS_MSG?.viewerAudioActivated);

            if (sessionId && wsClient) {
              debugLog('📤 [activateAudio] Отправляем viewerAudioActivated на сервер');
              // Отправляем сообщение БЕЗ задержки - WebSocket сам разберется если не подключен
              const result = wsClient.send(WS_MSG.viewerAudioActivated, { activated: true });
              debugLog('📤 [activateAudio] Результат отправки:', result);

              if (typeof logger !== 'undefined') {
                logger.audio('📤 Sent viewerAudioActivated to server');
              }
              return true;
            } else {
              debugLog('⚠️ [activateAudio] wsClient не готов:', {
                sessionId: !!sessionId,
                wsClient: !!wsClient
              });
            }
            return false;
          };

          // Отправляем сообщение сразу, без задержек
          const notificationResult = sendActivationNotification();
          debugLog('✅ [activateAudio] Уведомление отправлено:', notificationResult);
        };

        // НЕ добавляем глобальные обработчики, чтобы не скрывать overlay сразу
        // document.addEventListener('click', activateAudio, { once: true });
        // document.addEventListener('touchstart', activateAudio, { once: true });

        // ДОБАВЛЯЕМ: Обработчик для инициализации audio context при первом клике
        // Это необходимо для обхода браузерного ограничения на воспроизведение звука
        // Даже если оверлей скрыт (звук включен на контроллере), нужно инициализировать контекст
        const initAudioContextOnFirstUserGesture = () => {
          if (!audioActivated && audioManager && audioManager.enabled) {
            audioManager.init();
            audioActivated = true;
            window.audioActivated = true;
            localStorage.setItem('bb_audioActivated', 'true');
            if (typeof logger !== 'undefined') {
              logger.audio('🖱️ Audio context initialized on user gesture (implicit click) - кнопка скрыта');
            }
          }
          // Удаляем обработчик после первого срабатывания
          document.removeEventListener('click', initAudioContextOnFirstUserGesture);
          document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);
        };

        document.addEventListener('click', initAudioContextOnFirstUserGesture, { once: true });
        document.addEventListener('touchstart', initAudioContextOnFirstUserGesture, { once: true });

        const unmuteBtn = document.getElementById('unmuteBtn');
        if (unmuteBtn) {
          if (typeof logger !== 'undefined') {
            logger.audio('Unmute button найдена, добавляем обработчики');
          }
          unmuteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Предотвращаем всплытие

            // ВАЖНО: Удаляем глобальные обработчики чтобы избежать конфликтов
            document.removeEventListener('click', initAudioContextOnFirstUserGesture);
            document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);

            activateAudio();
          });
          unmuteBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // ВАЖНО: Удаляем глобальные обработчики чтобы избежать конфликтов
            document.removeEventListener('click', initAudioContextOnFirstUserGesture);
            document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);

            activateAudio();
          });
        } else {
          debugWarn('🔊 Unmute button НЕ найдена!');
        }

        // Экспортируем checkAudioOverlay глобально для отладки
        window.checkAudioOverlay = checkAudioOverlay;

        // Проверяем overlay сразу после инициализации
        checkAudioOverlay();
      }

      function checkAudioOverlay() {
        const overlay = document.getElementById('unmuteOverlay');
        if (!overlay) {
          debugWarn('🔊 checkAudioOverlay: overlay element НЕ найден!');
          return;
        }

        // Show overlay ONLY if:
        // 1. Sound is ENABLED on controller (!audioManager means not initialized yet, so hide)
        // 2. AND user hasn't activated audio yet
        // If sound is DISABLED on controller - hide overlay completely (button should not appear)
        const shouldShow = audioManager && audioManager.enabled && !audioActivated;

        if (typeof logger !== 'undefined') {
          logger.audio('checkAudioOverlay:', {
            audioManagerExists: !!audioManager,
            enabled: audioManager?.enabled,
            activated: audioActivated,
            shouldShow,
            overlayClasses: overlay.className
          });
        }

        if (shouldShow) {
          overlay.classList.remove('hidden');
          if (typeof logger !== 'undefined') {
            logger.audio('Показываем unmute overlay - звук включен на контроллере, но не активирован');
          }
        } else {
          overlay.classList.add('hidden');
          if (typeof logger !== 'undefined') {
            logger.audio('Скрываем unmute overlay', {
              reason: !audioManager ? 'audioManager не инициализирован' : !audioManager.enabled ? 'звук отключен на контроллере' : 'уже активирован'
            });
          }
        }
      }

      function onBounce(side, dirX, dirY) {
        // Play audio tick on bounce
        if (audioManager && audioManager.enabled && audioActivated) {
          audioManager.playTick();
        }

        // Send bounce to server via WebSocket
        if (wsClient) {
          wsClient.send('bounce', {
            side: side,
            dirX: dirX || 0,
            dirY: dirY || 0,
            timestamp: Date.now()
          }).catch(err => {
            debugWarn('Failed to send bounce:', err);
          });
        }
      }

      async function initializeViewer(sessionId) {
        try {
          debugLog("📱 Инициализация viewer для сессии:", sessionId);
          hideLoading();

          if (!globalThis.__current) {
            globalThis.__current = {};
          }
          globalThis.__current.sessionId = sessionId;

          const canvas = document.getElementById("viewerCanvas");
          if (!canvas) {
            console.error("Canvas не найден");
            return;
          }

          resizeCanvas();

          // Create bounce callback for audio
          const bounceCallback = (bounceData) => {
            onBounce(bounceData.side, bounceData.dirX, bounceData.dirY);
          };

          physicsEngine = new PhysicsEngine({
            worldWidth: globalThis.innerWidth,
            worldHeight: globalThis.innerHeight,
            isViewer: true,
            bounceCallback: bounceCallback,
          });
          globalThis.physicsEngine = physicsEngine;

          // Явно устанавливаем паузу и центрируем мяч при загрузке
          // Это гарантирует правильную позицию даже если контроллер не подключен
          physicsEngine.setPaused(true);

          ballRenderer = new BallRenderer(canvas, physicsEngine, {
            localPhysics: false,
          });

          // Связываем рендерер с физикой для инвалидации кэша
          physicsEngine.setRenderer(ballRenderer);

          await connectToSession(sessionId);

          wsClient = new WebSocketClient(sessionId, "viewer");
          globalThis.wsClient = wsClient;

          wsClient.on(WS_MSG.initialState, (state) => {
            if (typeof logger !== 'undefined') {
              logger.state("Получено начальное состояние", state);
            }

            // КРИТИЧЕСКИ ВАЖНО: Центрируем мяч ТОЛЬКО если сессия на паузе
            // При реконнекте во время активной сессии мяч должен оставаться в текущей позиции
            if (state && state.paused === true) {
              const centerX = globalThis.innerWidth / 2;
              const centerY = globalThis.innerHeight / 2;
              physicsEngine.setPosition(centerX, centerY);
              physicsEngine.setVelocity(0, 0);
              if (typeof logger !== 'undefined') {
                logger.state(`🎯 Мяч центрирован при паузе: (${centerX}, ${centerY})`);
              }
            }

            // Применяем команду из состояния
            physicsEngine.applyCommand(state);
            if (state && state.paused === false) {
              physicsEngine.setPaused(false);
            }
            // Handle audio settings from initial state
            if (typeof state.soundEnabled === 'boolean') {
              if (typeof logger !== 'undefined') {
                logger.audio('Получен soundEnabled из initialState:', state.soundEnabled);
              }

              if (audioManager) {
                audioManager.setEnabled(state.soundEnabled);

                // Управляем audioActivated на основе контроллера
                // ВАЖНО: Сбрасываем audioActivated ТОЛЬКО если контроллер ОТКЛЮЧИЛ звук
                // Если soundEnabled=true - НЕ сбрасываем, чтобы кнопка осталась скрытой
                if (state.soundEnabled === false) {
                  // Контроллер отключил звук - сбрасываем всё
                  audioActivated = false;
                  window.audioActivated = false;
                  localStorage.removeItem('bb_audioActivated');
                  if (typeof logger !== 'undefined') {
                    logger.audio('Контроллер отключил звук, сбрасываем audioActivated');
                  }
                }
                // Если soundEnabled=true - НЕ трогаем audioActivated!
                // Если пользователь уже активировал (audioActivated=true), кнопка остается скрытой
                // Если пользователь еще не активировал (audioActivated=false), кнопка будет показана

                checkAudioOverlay();
              } else {
                // AudioManager еще не инициализирован, подождем и повторим
                debugWarn('🔊 AudioManager не готов, ждем инициализации...');
                setTimeout(() => {
                  if (audioManager) {
                    if (typeof logger !== 'undefined') {
                      logger.audio('AudioManager готов, устанавливаем soundEnabled:', state.soundEnabled);
                    }
                    audioManager.setEnabled(state.soundEnabled);

                    // Управляем audioActivated - сбрасываем только если soundEnabled=false
                    if (state.soundEnabled === false) {
                      audioActivated = false;
                      window.audioActivated = false;
                      localStorage.removeItem('bb_audioActivated');
                    }
                    // Если soundEnabled=true - НЕ сбрасываем audioActivated!

                    checkAudioOverlay();
                  } else {
                    debugError('❌ AudioManager не инициализирован после таймаута!');
                  }
                }, 500);
              }

              if (state.soundType && audioManager) {
                audioManager.setSoundType(state.soundType);
              }
            }
            updateStatus(state);
          });

          wsClient.on(WS_MSG.stateUpdate, (command) => {
            physicsEngine.applyCommand(command);
            if (command && command.paused === false) {
              physicsEngine.setPaused(false);
            }
            // Handle audio settings
            if (typeof command.soundEnabled === 'boolean') {
              if (typeof logger !== 'undefined') {
                logger.audio('Получен soundEnabled из stateUpdate:', command.soundEnabled);
              }

              if (audioManager) {
                audioManager.setEnabled(command.soundEnabled);

                // Управляем audioActivated на основе контроллера
                // ВАЖНО: Сбрасываем audioActivated ТОЛЬКО если контроллер ОТКЛЮЧИЛ звук
                // Если soundEnabled=true - НЕ сбрасываем, чтобы кнопка осталась скрытой
                if (command.soundEnabled === false) {
                  // Контроллер отключил звук - сбрасываем всё
                  audioActivated = false;
                  window.audioActivated = false;
                  localStorage.removeItem('bb_audioActivated');
                  if (typeof logger !== 'undefined') {
                    logger.audio('Контроллер отключил звук, сбрасываем audioActivated');
                  }
                }
                // Если soundEnabled=true - НЕ трогаем audioActivated!
                // Если пользователь уже активировал (audioActivated=true), кнопка остается скрытой

                checkAudioOverlay();
              } else {
                debugWarn('🔊 AudioManager не готов при stateUpdate');
              }

              if (command.soundType && audioManager) {
                audioManager.setSoundType(command.soundType);
              }
            }
            // НЕ обновляем статус контроллера при обновлениях состояния мяча
            // updateStatus(command);
          });

          // Обработчик для события подключения контроллера
          wsClient.on("controller_connected", (data) => {
            debugLog("🔌 Контроллер подключился:", data);
            updateStatus(data);
          });

          wsClient.on("controller_disconnected", (data) => {
            debugLog("🔌 Контроллер отключился:", data);
            updateStatus(data);
          });

          wsClient.on("open", (event) => {
            debugLog("✅ WebSocket connection established.");
            components.status.setStatus("success", "Соединение установлено");

            // CRITICAL FIX: Upon reconnection, request full state sync to restore ball position
            // When connection drops (code 1006), ball position becomes stale. We must request fresh state.
            if (event?.isReconnection) {
              debugWarn("🔄 Reconnected - requesting state sync to restore ball position");
              // Request initial state which will restore proper position
              wsClient
                .send("request_state_sync", {
                  timestamp: Date.now(),
                  sessionId: sessionId,
                  role: "viewer"
                })
                .catch((error) =>
                  debugWarn("Не удалось запросить синхронизацию состояния:", error),
                );
            }

            // Запрашиваем текущее состояние подключения контроллера
            wsClient
              .send("get_controller_status", {})
              .catch((error) =>
                debugWarn("Не удалось запросить статус контроллера:", error),
              );

            // Уведомляем сервер о подключении вьювера
            wsClient.send("viewer_connected", {
              timestamp: Date.now(),
              sessionId: sessionId,
              role: "viewer",
            });
          });

          wsClient.on("close", (event) => {
            debugWarn("🔌 WebSocket connection closed.");

            // CRITICAL FIX: Code 1006 is abnormal closure - forcibly reset ball position
            // This prevents the ball from staying in wrong position after disconnect
            if (event.code === 1006) {
              debugError("⚠️ ABNORMAL DISCONNECTION (code 1006) - resetting ball state");

              // Force pause and center ball
              if (physicsEngine) {
                physicsEngine.setPaused(true);
                const centerX = globalThis.innerWidth / 2;
                const centerY = globalThis.innerHeight / 2;
                physicsEngine.setPosition(centerX, centerY);
                physicsEngine.setVelocity(0, 0);
                debugLog(`✅ Ball reset to center: (${centerX}, ${centerY})`);
              }
            }

            showError("Соединение потеряно. Попытка переподключения...");
          });

          wsClient.on("error", (error) => {
            debugError("❌ WebSocket error:", error);
            showError("Ошибка соединения.");
          });

          // Обработчик для получения статуса контроллера
          wsClient.on("controller_status", (status) => {
            debugLog("📊 Статус контроллера:", status);
            updateStatus(status);
          });

          await wsClient.connect();

          // Physics and render loops
          const PHYSICS_TICK_RATE = 60;
          const PHYSICS_DT = 1000 / PHYSICS_TICK_RATE;
          let lastPhysicsUpdateTs = performance.now();

          function physicsLoop() {
            if (physicsEngine) {
              physicsEngine.update(PHYSICS_DT / 1000);
              lastPhysicsUpdateTs = performance.now();
            }
          }

          function renderLoop() {
            if (!physicsEngine || !ballRenderer) {
              requestAnimationFrame(renderLoop);
              return;
            }

            const now = performance.now();
            const alpha = Math.max(
              0,
              Math.min(1, (now - lastPhysicsUpdateTs) / PHYSICS_DT),
            );

            const interpolatedState = physicsEngine.getInterpolatedBall(alpha);
            ballRenderer.drawFrame(interpolatedState);
            requestAnimationFrame(renderLoop);
          }

          setInterval(physicsLoop, PHYSICS_DT);
          requestAnimationFrame(renderLoop);
          setupEventListeners();

          // Auto-hide hotkeys hint after 10 seconds
          setTimeout(() => {
            const hotkeysHint = document.getElementById('hotkeysHint');
            if (hotkeysHint) {
              hotkeysHint.classList.add('hidden');
            }
          }, 10000);

          debugLog("✅ Viewer успешно инициализирован");
        } catch (error) {
          debugError("❌ Ошибка инициализации viewer:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      }

      async function connectToSession(sessionId) {
        try {
          const canvasElement = document.getElementById("viewerCanvas");
          if (!canvasElement) {
            console.error("Canvas не найден");
            return;
          }

          const response = await fetch(
            `/api/session/${sessionId}/viewer/connect`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                screenSize: {
                  width: globalThis.innerWidth,
                  height: globalThis.innerHeight,
                },
              }),
            },
          );

          if (!response.ok) {
            const errorText = await response.text();
            // Исправлено: убрали throw из try-catch для избежания ошибки
            const errorMessage = `HTTP ${response.status}: ${errorText || "Не удалось подключиться к сессии"}`;
            debugError("❌ Ошибка подключения к сессии:", errorMessage);
            showError(errorMessage);
            return;
          }

          debugLog("✅ Подключение к сессии успешно");
        } catch (error) {
          debugError("❌ Ошибка подключения к сессии:", error);
          showError("Ошибка подключения: " + error.message);
        }
      }

      function resizeCanvas() {
        const canvas = document.getElementById("viewerCanvas");
        if (!canvas) return;

        canvas.width = globalThis.innerWidth;
        canvas.height = globalThis.innerHeight;

        if (physicsEngine) {
          physicsEngine.setWorldSize(canvas.width, canvas.height);
        }

        if (ballRenderer) {
          ballRenderer.resize(canvas.width, canvas.height);
        }
      }

      async function updateScreenSize() {
        const sessionId = getSessionIdFromUrl();
        if (!sessionId) return;

        try {
          const now = Date.now();
          if (now - lastScreenSizeUpdate < 2000) {
            return;
          }

          const response = await fetch(
            `/api/session/${sessionId}/viewer/screen-size`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                width: globalThis.innerWidth,
                height: globalThis.innerHeight,
              }),
              signal: AbortSignal.timeout(5000),
            },
          );

          if (!response.ok) {
            const errorText = await response.text();
            const errorMessage = `HTTP ${response.status}: ${errorText || "Неизвестная ошибка"}`;
            showWarning(`Не удалось обновить размер экрана: ${errorMessage}`);
            return;
          }

          lastScreenSizeUpdate = now;
          debugLog(
            `✅ Размер экрана обновлен на сервере: ${globalThis.innerWidth}×${globalThis.innerHeight}`,
          );
        } catch (error) {
          if (error.name === "AbortError") {
            debugLog("⏰ Таймаут при обновлении размера экрана");
          } else if (
            error.name === "TypeError" &&
            error.message.includes("fetch")
          ) {
            debugLog("🌐 Сеть недоступна при обновлении размера экрана");
          } else {
            debugError("Ошибка при обновлении размера экрана:", error);
          }
        }
      }

      function updateStatus(sessionData) {
        if (components.status) {
          debugLog("📊 Обновление статуса:", sessionData);

          // Проверяем наличие данных о подключении контроллера
          if (sessionData.controllerConnected === true) {
            components.status.setStatus("success", "Контроллер подключен");
            debugLog("✅ Статус обновлен: Контроллер подключен");
          } else if (sessionData.controllerConnected === false) {
            components.status.setStatus("error", "Контроллер отключен");
            debugLog("❌ Статус обновлен: Контроллер отключен");
          } else {
            // Если данных о контроллере нет, используем статус WebSocket соединения
            const isWebSocketConnected = wsClient && typeof wsClient.isConnected === 'function' && wsClient.isConnected();
            if (isWebSocketConnected) {
              components.status.setStatus(
                "waiting",
                "Ожидание контроллера...",
              );
              debugLog("⏳ Статус обновлен: Ожидание контроллера");
            } else {
              components.status.setStatus("error", "Контроллер отключен");
              debugLog(
                "❌ Статус обновлен: Контроллер отключен (нет WebSocket)",
              );
            }
          }
        }
      }

      function showError(message) {
        if (components.status) {
          components.status.setStatus("error", message);
        }
      }

      function showWarning(message) {
        debugWarn("⚠️ Предупреждение viewer:", message);
      }

      function hideLoading() {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.display = "none";
        }
      }

      // Fullscreen & Mobile
      let screenWakeLock = null;

      async function requestScreenWakeLock() {
        try {
          if (
            "wakeLock" in navigator &&
            document.visibilityState === "visible"
          ) {
            screenWakeLock = await navigator.wakeLock.request("screen");
            screenWakeLock.addEventListener("release", () => {
              debugLog("🔓 Wake Lock released");
            });
            debugLog("🔒 Wake Lock acquired");
          }
        } catch (e) {
          debugWarn("Wake Lock not available:", e?.message || e);
        }
      }

      async function releaseScreenWakeLock() {
        try {
          if (screenWakeLock) {
            await screenWakeLock.release();
            screenWakeLock = null;
          }
        } catch (error) {
          debugError("Could not release screen wake lock:", error);
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && isFullscreen) {
          requestScreenWakeLock();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        isFullscreen = !!(
          document.fullscreenElement ||
          document["webkitFullscreenElement"] ||
          document["msFullscreenElement"] ||
          document["mozFullScreenElement"]
        );
        const btn = document.querySelector(".fullscreen-btn");
        if (btn) {
          btn.textContent = isFullscreen ? "⛶ Выйти" : "⛶ Полноэкранный";
        }
        if (isFullscreen) {
          requestScreenWakeLock();
        } else {
          releaseScreenWakeLock();
        }
      });

      // Double tap for fullscreen
      let lastTap = 0;
      document
        .getElementById("viewerCanvas")
        .addEventListener("touchend", function (event) {
          const currentTime = Date.now();
          if (currentTime - lastTap < 300) {
            event.preventDefault();
            toggleFullscreen();
          }
          lastTap = currentTime;
        });

      function setupEventListeners() {
        if (globalThis) {
          globalThis.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
              resizeCanvas();
              updateScreenSize().catch(() => {
                debugLog("Размер экрана не обновлен (сеть недоступна)");
              });
            }, 1500);
          });
        }

        if (document) {
          document.addEventListener("gesturestart", (event) =>
            event.preventDefault(),
          );
          document.addEventListener("gesturechange", (event) =>
            event.preventDefault(),
          );
          document.addEventListener("gestureend", (event) =>
            event.preventDefault(),
          );

          // Hotkey handler - Space for pause/play
          document.addEventListener("keydown", handleViewerHotkey);
        }
      }

      /**
       * Обработчик горячих клавиш для viewer
       * @param {KeyboardEvent} event - Событие нажатия клавиши
       */
      function handleViewerHotkey(event) {
        // Игнорируем, если фокус на input/textarea
        if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
          return;
        }

        // Space - pause/play
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          toggleViewerPlayPause();
        }
      }

      /**
       * Переключает паузу/старт во viewer
       * Отправляет команду на сервер для синхронизации с controller
       */
      function toggleViewerPlayPause() {
        if (!physicsEngine || !wsClient) {
          debugWarn('⚠️ PhysicsEngine или WebSocket не инициализированы');
          return;
        }

        const currentPaused = physicsEngine.state.paused;
        const newPaused = !currentPaused;

        debugLog(`🎮 Viewer hotkey: ${newPaused ? 'ПАУЗА' : 'СТАРТ'}`);

        // Показываем подсказку на 2 секунды при использовании
        const hotkeysHint = document.getElementById('hotkeysHint');
        if (hotkeysHint) {
          hotkeysHint.classList.remove('hidden');
          setTimeout(() => {
            hotkeysHint.classList.add('hidden');
          }, 2000);
        }

        // Отправляем команду на сервер
        const payload = {
          paused: newPaused,
          returnToCenter: newPaused, // При паузе возвращаем мяч в центр
          timestamp: Date.now()
        };

        // КРИТИЧЕСКИ ВАЖНО: Применяем паузу ЯВНО для мгновенного отклика
        physicsEngine.setPaused(newPaused);

        // Если пауза - центрируем мяч
        if (newPaused) {
          physicsEngine.setPosition(physicsEngine.centerX, physicsEngine.centerY);
          physicsEngine.setVelocity(0, 0);
        }

        // Также применяем через applyCommand для других настроек
        physicsEngine.applyCommand(payload);

        // Отправляем на сервер через WebSocket
        wsClient.send('viewer_update', payload).catch(err => {
          debugWarn('❌ Не удалось отправить viewer_update:', err);
        });

        // Показываем уведомление
        if (components.status) {
          const statusText = newPaused ? '⏸️ Пауза' : '▶️ Воспроизведение';
          components.status.setStatus('success', statusText);
          // Автоматически скрываем через 2 секунды
          setTimeout(() => {
            if (components.status && typeof wsClient.isConnected === 'function' && wsClient.isConnected()) {
              components.status.setStatus('success', 'Контроллер подключен');
            }
          }, 2000);
        }
      }

      // Экспортируем функцию глобально для доступа из консоли
      globalThis.toggleViewerPlayPause = toggleViewerPlayPause;
    </script>
  </body>
</html>
