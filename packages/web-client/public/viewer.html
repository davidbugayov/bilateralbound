    <script>
      "use strict";
      /**
       * @typedef {Object} StatusIndicatorComponent
       * @property {function(string, string): void} setStatus - Устанавливает статус индикатора
       */
      // Helper functions - defined early before DOMContentLoaded
      function showError(message) {
        console.error('❌ Viewer Error:', message);
        const loading = document.getElementById('loading');
        if (loading) {
          loading.textContent = '❌ ' + message;
          loading.style.color = '#ef4444';
        }
      }
      function hideLoading() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }
      function resizeCanvas() {
        const canvas = document.getElementById('viewerCanvas');
        if (canvas) {
          canvas.width = globalThis.innerWidth;
          canvas.height = globalThis.innerHeight;
        }
      }
      async function connectToSession(sessionId) {
        try {
          const response = await fetch(`/api/session/${sessionId}/viewer/connect`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ screenSize: { width: globalThis.innerWidth, height: globalThis.innerHeight } })
          });
          if (response.ok) {
            debugLog('✅ Viewer connected to session');
          } else {
            debugWarn('⚠️ Failed to connect viewer to session');
          }
        } catch (error) {
          debugWarn('⚠️ Error connecting to session:', error);
        }
      }
      function updateStatus(data) {
        // Трекаем состояние подключения контроллера
        if (!globalThis.__current) globalThis.__current = {};
        if (typeof data.controllerConnected === 'boolean') {
          globalThis.__current.controllerConnected = data.controllerConnected;
          console.log('📊 [VIEWER] controllerConnected updated to:', data.controllerConnected);
        }
        if (components.status) {
          if (data.controllerConnected === true) {
            const msg = globalThis.i18n?.t('viewer.controllerConnected') || 'Controller connected';
            components.status.setStatus('success', msg);
          } else if (data.controllerConnected === false) {
            const msg = globalThis.i18n?.t('viewer.waitingForController') || 'Waiting for controller...';
            components.status.setStatus('waiting', msg);
          }
        }
      }
      function onStateUpdate(state) {
        // Применяем язык из initial_state (один раз при подключении)
        if (state && state.language && state.language !== localStorage.getItem('emdr-language')) {
          onLanguageUpdate({ language: state.language });
        }
        // Обновляем статус подключения контроллера из любого обновления состояния
        if (state && typeof state.controllerConnected === 'boolean') {
          updateStatus(state);
        }
        if (physicsEngine && state) {
          debugLog('📥 [VIEWER] Received state update:', state);
          physicsEngine.applyCommand(state);
          if (typeof state.paused === 'boolean') {
            physicsEngine.setPaused(state.paused);
          }
          debugLog('📥 [VIEWER] Engine state after update:', {
            paused: physicsEngine.state.paused,
            dirX: physicsEngine.state.lastDirection.x,
            dirY: physicsEngine.state.lastDirection.y,
            speed: physicsEngine.ball.speed,
            vx: physicsEngine.ball.vx,
            vy: physicsEngine.ball.vy
          });
          // Log current colors after update
          debugLog('🎨 Current colors:', {
             ball: physicsEngine.colors.ball,
             bg: physicsEngine.colors.bg
          });
        }
        // ВАЖНО: Обрабатываем звук из state_update
        // Звук - критический параметр, должен применяться независимо от physics engine
        if (state && audioManager) {
          if (typeof state.soundEnabled === 'boolean') {
            debugLog('🔊 [VIEWER] soundEnabled from state:', state.soundEnabled);
            audioManager.setEnabled(state.soundEnabled);
            checkAudioOverlay();
          }
          if (state.soundType) {
            debugLog('🔊 [VIEWER] soundType from state:', state.soundType);
            audioManager.setSoundType(state.soundType);
          }
        }
      }
      /**
       * Обработчик обновления языка от контроллера через SSE
       * Синхронизирует язык вьювера с контроллером
       * @param {Object} data - Данные события
       */
      function onLanguageUpdate(data) {
        const language = data?.language;
        if (!language) {
          debugWarn('❌ Invalid language update data:', data);
          return;
        }

        debugLog('🌍 Language update received:', language);

        // Применяем язык через i18n если доступен
        if (globalThis.i18n && typeof globalThis.i18n.setLanguage === 'function') {
          try {
            globalThis.i18n.setLanguage(language);
            debugLog('✅ Language applied:', language);
          } catch (err) {
            debugWarn('❌ Failed to apply language:', err.message);
          }
        } else {
          debugWarn('⚠️ i18n not available for language update');
        }
      }
      /**
       * Запускает периодическую отправку состояния viewer на сервер
       * Это необходимо для синхронизации Controller Preview с Viewer
       */
      function startViewerStateBroadcast() {
        const BROADCAST_RATE = 5; // Hz — enough for controller preview sync
        const BROADCAST_INTERVAL = 1000 / BROADCAST_RATE;
        let lastPausedSent = false;
        setInterval(() => {
          if (!physicsEngine || !wsClient) return;
          const ball = physicsEngine.ball;
          const state = physicsEngine.state;
          const isMoving = !state.paused && (Math.abs(ball.vx) > 0.1 || Math.abs(ball.vy) > 0.1);
          // Skip if paused and we already sent paused state
          if (state.paused && lastPausedSent) return;
          lastPausedSent = state.paused;
          if (isMoving || state.paused) {
            wsClient.send('viewer_update', {
              x: ball.x,
              y: ball.y,
              vx: ball.vx,
              vy: ball.vy,
              dirX: state.lastDirection?.x ?? 0,
              dirY: state.lastDirection?.y ?? 0,
              speed: ball.speed,
              paused: state.paused,
              radius: ball.radius,
              timestamp: Date.now()
            }).catch(() => {});
          }
        }, BROADCAST_INTERVAL);
        debugLog('✅ Viewer state broadcast started at', BROADCAST_RATE, 'Hz');
      }
      function setupEventListeners() {
        globalThis.addEventListener('resize', () => {
          resizeCanvas();
          // Send updated screen size to server via WS
          if (wsClient) {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
              wsClient.send('viewer_screen_size', {
                width: globalThis.innerWidth,
                height: globalThis.innerHeight
              }).catch(() => {});
            }, 300);
          }
        });
        // Fullscreen toggle
        globalThis.toggleFullscreen = function() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
              debugWarn('Error attempting to enable fullscreen:', err);
            });
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        };
        // Обновление текста кнопки при изменении fullscreen
        function updateFullscreenButton() {
          const btn = document.querySelector('.fullscreen-btn');
          if (!btn) return;
          const isFs = !!document.fullscreenElement;
          const key = isFs ? 'viewer.exitFullscreen' : 'viewer.fullscreen';
          const fallback = isFs ? '⛶ Выйти' : '⛶ Полноэкранный';
          btn.textContent = globalThis.i18n?.t ? globalThis.i18n.t(key) : fallback;
          btn.setAttribute('data-i18n', key);
        }
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        // Обновляем все переводы при готовности i18n
        globalThis.addEventListener('i18nReady', () => {
          if (globalThis.i18n?.applyTranslations) {
            globalThis.i18n.applyTranslations();
          }
        });
        // Также при смене языка
        globalThis.addEventListener('i18nLanguageChanged', () => {
          if (globalThis.i18n?.applyTranslations) {
            globalThis.i18n.applyTranslations();
          }
          updateFullscreenButton();
        });
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            // Toggle pause via websocket
            if (wsClient && physicsEngine) {
              const currentPaused = physicsEngine.state?.paused ?? true;
              const newPaused = !currentPaused;
              debugLog(`[VIEWER] Space pressed: toggling pause from ${currentPaused} to ${newPaused}`);
              wsClient.send('viewer_update', { paused: newPaused });
            }
          }
        });
      }
      // Global variables
      let wsClient;
      let physicsEngine;
      let ballRenderer;
      let isFullscreen = false;
      let audioManager = null;
      // audioActivated начинается с false и обновляется только на основе контроллера
      // НЕ восстанавлием из localStorage при инициализации - это вызывает проблемы
      // localStorage используется только для сохранения между сессиями пользователя
      let audioActivated = false;
      let pendingSoundEnabled = false; // если звук включили до инициализации AudioManager
      /** @type {Object} */
      const components = {};
      // components.status will be assigned in initializeComponents() and has setStatus method
      let resizeTimeout = null;
      let lastScreenSizeUpdate = 0;
      // Track controller connection status to prevent UI "jumping"
      let lastKnownControllerStatus = null;
      // Expose to window for debugging
      if (typeof window !== 'undefined') {
        window.audioManager = audioManager;
        window.audioActivated = audioActivated;
        // Функция для сброса состояния активации аудио (для отладки)
        window.resetAudioActivation = function() {
          localStorage.removeItem('bb_audioActivated');
          audioActivated = false;
          window.audioActivated = false;
          if (audioManager) {
            checkAudioOverlay();
          }
          console.log('🔊 Audio activation state reset. Reload page to see unmute overlay again.');
        };
      }
      // Initialize on DOM load
      document.addEventListener("DOMContentLoaded", async function () {
        debugLog('🚀 DOMContentLoaded fired');
        debugLog('🔊 Audio activation state restored from localStorage:', audioActivated);
        debugLog('🚀 Доступные глобальные объекты:', {
          AudioManager: typeof AudioManager,
          PhysicsEngine: typeof PhysicsEngine,
          BallRenderer: typeof BallRenderer,
          WebSocketClient: typeof WebSocketClient,
          SSEClient: typeof SSEClient,
          RealtimeClient: typeof RealtimeClient,
          sharedComponents: typeof sharedComponents
        });
        try {
          const sessionId = getSessionIdFromUrl();
          if (!sessionId) {
            showError("Session ID не найден в URL");
            return;
          }
          debugLog("📱 Session ID получен:", sessionId);
          initializeComponents();
          await initializeViewer(sessionId);
        } catch (error) {
          debugError("❌ Критическая ошибка инициализации:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      });
      function initializeComponents() {
        debugLog('📦 initializeComponents вызван');
        components.status = sharedComponents.createStatusIndicator(
          document.getElementById("statusContainer"),
          {
            title: "Подключение...",
            showIcon: true,
            autoHide: false,
          },
        );
        debugLog('📦 Status indicator создан');
        // Initialize Audio Manager (с задержкой если еще не загружен)
        debugLog('🔊 Проверка AudioManager:', typeof AudioManager);
        if (typeof AudioManager !== 'undefined') {
          debugLog('🔊 AudioManager доступен, инициализируем сразу');
          initAudioManager();
        } else {
          debugLog('🔊 AudioManager еще не загружен, ждем...');
          let attempts = 0;
          // Ждем загрузки AudioManager
          const checkAudioManager = setInterval(() => {
            attempts++;
            debugLog(`🔊 Попытка ${attempts}/50 найти AudioManager:`, typeof AudioManager);
            if (typeof AudioManager !== 'undefined') {
              clearInterval(checkAudioManager);
              debugLog('🔊 AudioManager загружен, инициализируем');
              initAudioManager();
            }
          }, 100);
          // Таймаут на случай если AudioManager не загрузится
          setTimeout(() => {
            clearInterval(checkAudioManager);
            if (typeof AudioManager === 'undefined') {
              debugError('❌ AudioManager не загрузился за 5 секунд!');
            }
          }, 5000);
        }
      }
      function initAudioManager() {
        if (typeof AudioManager === 'undefined') {
          debugWarn('AudioManager not loaded yet');
          return;
        }
        audioManager = new AudioManager();
        window.audioManager = audioManager; // Expose for debugging
        if (typeof logger !== 'undefined') {
          logger.audio('AudioManager создан, enabled:', audioManager.enabled);
        }
        // НЕ инициализируем audio из localStorage автоматически
        // Audio будет инициализирован только когда:
        // 1. Контроллер включит звук (soundEnabled=true)
        // 2. И пользователь сделает какой-то жест (клик/касание)
        // Это гарантирует что audio не будет инициализирован если контроллер отключил звук
        // Setup user gesture handlers for audio activation
        const activateAudio = () => {
          debugLog('🔘 [activateAudio] Функция вызвана');
          debugLog('🔘 audioManager:', audioManager);
          debugLog('🔘 audioActivated:', audioActivated);
          // Проверяем что audioManager существует
          if (!audioManager) {
            debugWarn('❌ [activateAudio] audioManager не инициализирован!');
            return;
          }
          debugLog('🔘 [activateAudio] audioManager существует, инициализируем...');
          // Инициализируем AudioContext
          audioManager.init();
          debugLog('✅ [activateAudio] audioManager.init() вызван');
          // Устанавливаем флаг активации
          audioActivated = true;
          window.audioActivated = true;
          localStorage.setItem('bb_audioActivated', 'true');
          debugLog('✅ [activateAudio] audioActivated установлен на true');
          // Обновляем UI - скрываем кнопку
          debugLog('🔘 [activateAudio] Вызываем checkAudioOverlay()...');
          checkAudioOverlay();
          debugLog('✅ [activateAudio] checkAudioOverlay() вызван');
          if (typeof logger !== 'undefined') {
            logger.audio('✅ Audio activated by user gesture - кнопка нажата!');
          }
          // Отправляем на сервер что зритель активировал звук
          const sendActivationNotification = () => {
            const sessionId = getSessionIdFromUrl();
            debugLog('📤 [sendActivationNotification] sessionId:', sessionId);
            debugLog('📤 [sendActivationNotification] wsClient:', !!wsClient);
            debugLog('📤 [sendActivationNotification] wsClient.send:', typeof wsClient?.send);
            debugLog('📤 [sendActivationNotification] WS_MSG.viewerAudioActivated:', WS_MSG?.viewerAudioActivated);
            if (sessionId && wsClient) {
              debugLog('📤 [activateAudio] Отправляем viewerAudioActivated на сервер');
              // Отправляем сообщение БЕЗ задержки - WebSocket сам разберется если не подключен
              const result = wsClient.send(WS_MSG.viewerAudioActivated, { activated: true });
              debugLog('📤 [activateAudio] Результат отправки:', result);
              if (typeof logger !== 'undefined') {
                logger.audio('📤 Sent viewerAudioActivated to server');
              }
              return true;
            } else {
              debugLog('⚠️ [activateAudio] wsClient не готов:', {
                sessionId: !!sessionId,
                wsClient: !!wsClient
              });
            }
            return false;
          };
          // Отправляем сообщение сразу, без задержек
          const notificationResult = sendActivationNotification();
          debugLog('✅ [activateAudio] Уведомление отправлено:', notificationResult);
        };
        // НЕ добавляем глобальные обработчики, чтобы не скрывать overlay сразу
        // document.addEventListener('click', activateAudio, { once: true });
        // document.addEventListener('touchstart', activateAudio, { once: true });
        // ДОБАВЛЯЕМ: Обработчик для инициализации audio context при первом клике
        // Это необходимо для обхода браузерного ограничения на воспроизведение звука
        // Даже если оверлей скрыт (звук включен на контроллере), нужно инициализировать контекст
        const initAudioContextOnFirstUserGesture = () => {
          if (!audioActivated && audioManager && audioManager.enabled) {
            audioManager.init();
            audioActivated = true;
            window.audioActivated = true;
            localStorage.setItem('bb_audioActivated', 'true');
            if (typeof logger !== 'undefined') {
              logger.audio('🖱️ Audio context initialized on user gesture (implicit click) - кнопка скрыта');
            }
          }
          // Удаляем обработчик после первого срабатывания
          document.removeEventListener('click', initAudioContextOnFirstUserGesture);
          document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);
        };
        document.addEventListener('click', initAudioContextOnFirstUserGesture, { once: true });
        document.addEventListener('touchstart', initAudioContextOnFirstUserGesture, { once: true });
        const unmuteBtn = document.getElementById('unmuteBtn');
        if (unmuteBtn) {
          if (typeof logger !== 'undefined') {
            logger.audio('Unmute button найдена, добавляем обработчики');
          }
          unmuteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Предотвращаем всплытие
            // ВАЖНО: Удаляем глобальные обработчики чтобы избежать конфликтов
            document.removeEventListener('click', initAudioContextOnFirstUserGesture);
            document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);
            activateAudio();
          });
          unmuteBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            // ВАЖНО: Удаляем глобальные обработчики чтобы избежать конфликтов
            document.removeEventListener('click', initAudioContextOnFirstUserGesture);
            document.removeEventListener('touchstart', initAudioContextOnFirstUserGesture);
            activateAudio();
          });
        } else {
          debugWarn('🔊 Unmute button НЕ найдена!');
        }
        // Экспортируем checkAudioOverlay глобально для отладки
        window.checkAudioOverlay = checkAudioOverlay;
        // ВАЖНО: Применяем отложенный soundEnabled если он был получен до готовности AudioManager
        if (pendingSoundEnabled !== false) {
          debugLog('🔊 Применяем отложенный soundEnabled:', pendingSoundEnabled);
          audioManager.setEnabled(pendingSoundEnabled);
          pendingSoundEnabled = false;
        }
        // Проверяем overlay сразу после инициализации
        checkAudioOverlay();
      }
      function checkAudioOverlay() {
        const overlay = document.getElementById('unmuteOverlay');
        if (!overlay) {
          debugWarn('🔊 checkAudioOverlay: overlay element НЕ найден!');
          return;
        }
        // Show overlay ONLY if:
        // 1. Sound is ENABLED on controller (!audioManager means not initialized yet, so hide)
        // 2. AND user hasn't activated audio yet
        // If sound is DISABLED on controller - hide overlay completely (button should not appear)
        const shouldShow = audioManager && audioManager.enabled && !audioActivated;
        if (typeof logger !== 'undefined') {
          logger.audio('checkAudioOverlay:', {
            audioManagerExists: !!audioManager,
            enabled: audioManager?.enabled,
            activated: audioActivated,
            shouldShow,
            overlayClasses: overlay.className
          });
        }
        if (shouldShow) {
          overlay.classList.remove('hidden');
          if (typeof logger !== 'undefined') {
            logger.audio('Показываем unmute overlay - звук включен на контроллере, но не активирован');
          }
        } else {
          overlay.classList.add('hidden');
          if (typeof logger !== 'undefined') {
            logger.audio('Скрываем unmute overlay', {
              reason: !audioManager ? 'audioManager не инициализирован' : !audioManager.enabled ? 'звук отключен на контроллере' : 'уже активирован'
            });
          }
        }
      }
      function onBounce(side, dirX, dirY) {
        // Play audio tick on bounce
        if (audioManager && audioManager.enabled && audioActivated) {
          audioManager.playTick();
        }
        // Send bounce with ball position to server for controller sync
        if (wsClient && physicsEngine) {
          const ball = physicsEngine.ball;
          wsClient.send('bounce', {
            side: side,
            x: ball.x,
            y: ball.y,
            dirX: dirX || 0,
            dirY: dirY || 0,
            timestamp: Date.now()
          }).catch(err => {
            debugWarn('Failed to send bounce:', err);
          });
        }
      }
      async function initializeViewer(sessionId) {
        try {
          debugLog("📱 Инициализация viewer для сессии:", sessionId);
          hideLoading();
          if (!globalThis.__current) {
            globalThis.__current = {};
          }
          globalThis.__current.sessionId = sessionId;
          const canvas = document.getElementById("viewerCanvas");
          if (!canvas) {
            console.error("Canvas не найден");
            return;
          }
          resizeCanvas();
          // Create bounce callback for audio
          const bounceCallback = (bounceData) => {
            onBounce(bounceData.side, bounceData.dirX, bounceData.dirY);
          };
          physicsEngine = new PhysicsEngine({
            worldWidth: globalThis.innerWidth,
            worldHeight: globalThis.innerHeight,
            isViewer: true,
            clientSimulation: true, // Client-side simulation for smooth movement
            bounceCallback: bounceCallback,
          });
          globalThis.physicsEngine = physicsEngine;
          // ИСПРАВЛЕНИЕ: явно вызываем setWorldSize для установки флага _worldSizeSet
          // Это необходимо для работы updateClientPhysics на viewer
          physicsEngine.setWorldSize(globalThis.innerWidth, globalThis.innerHeight);
          // Явно устанавливаем паузу и центрируем мяч при загрузке
          // Это гарантирует правильную позицию даже если контроллер не подключен
          physicsEngine.setPaused(true);
          ballRenderer = new BallRenderer(canvas, physicsEngine, {
            localPhysics: true,  // ИСПРАВЛЕНИЕ: включаем локальную физику для viewer
          });
          // Связываем рендерер с физикой для инвалидации кэша
          physicsEngine.setRenderer(ballRenderer);
          await connectToSession(sessionId);
          // SSE-only соединение
          wsClient = new RealtimeClient(sessionId, "viewer");
          globalThis.wsClient = wsClient;
          debugLog("✅ WebSocketClient создан");
          // Запрос состояния через REST (при реконнекте)
          async function fetchAndApplyState() {
            try {
              const resp = await fetch(`/api/session/${sessionId}/state`)
              if (!resp.ok) return
              const state = await resp.json()
              onStateUpdate(state)
              updateStatus(state)
            } catch (e) {
              debugWarn('Не удалось получить состояние через REST', e)
            }
          }
          wsClient.on("open", (event) => {
            debugLog("✅ WS connection established.")
            const connMsg = globalThis.i18n?.t('viewer.connectionEstablished') || 'Connection established';
            components.status.setStatus("success", connMsg)
            // При реконнекте тянем свежее состояние через REST
            if (event?.isReconnection) {
              debugWarn("🔄 WS reconnected - fetching state via REST")
              fetchAndApplyState()
            }
            // Уведомляем сервер о подключении вьювера с размерами экрана
            wsClient.send("viewer_connected", {
              timestamp: Date.now(),
              sessionId: sessionId,
              role: "viewer",
              screenSize: {
                width: globalThis.innerWidth,
                height: globalThis.innerHeight
              }
            }).catch(() => {})
          })
          wsClient.on("close", () => {
            debugWarn("🔌 WS connection closed.");
            showError(globalThis.i18n?.t('viewer.connectionLost') || "Соединение потеряно. Попытка переподключения...");
          });
          wsClient.on("error", (error) => {
            // Не показываем ошибку connection_closed если это первая попытка подключения
            // или если контроллер еще не подключался (это нормально)
            const isConnectionClosed = error?.type === 'connection_closed'
            const isFirstAttempt = error?.isFirstAttempt === true
            const controllerNeverConnected = !globalThis.__current?.controllerConnected
            if (isConnectionClosed && (isFirstAttempt || controllerNeverConnected)) {
              // Это нормальная ситуация - не показываем ошибку пользователю
              debugLog(`ℹ️ Realtime: ${error?.type} (${isFirstAttempt ? 'first attempt' : 'controller not connected yet'})`)
              return
            }
            // Критическая ошибка - показываем
            debugError("❌ WebSocket error:", error);
            if (error?.type === 'connection') {
              showError("Ошибка соединения с сервером.");
            }
          });
          // Обработчик для получения статуса контроллера
          wsClient.on("controller_status", (status) => {
            debugLog("📊 Статус контроллера:", status);
            updateStatus(status);
          });
          // FIX: Add listeners for specific controller connection events which SSE emits
          wsClient.on("controller_connected", (data) => {
            console.log("📊 [VIEWER] Controller connected event received:", JSON.stringify(data));
            debugLog("📊 Controller connected event:", data);
            // SSE sends payload directly, ensure we have controllerConnected property
            const statusData = data.controllerConnected !== undefined
              ? data
              : { controllerConnected: true };
            updateStatus(statusData);
          });
          wsClient.on("controller_disconnected", (data) => {
            console.log("📊 [VIEWER] Controller disconnected event received:", JSON.stringify(data));
            debugLog("📊 Controller disconnected event:", data);
            // SSE sends payload directly, ensure we have controllerConnected property
            const statusData = data.controllerConnected !== undefined
              ? data
              : { controllerConnected: false };
            updateStatus(statusData);
          });
          wsClient.on('state_update', onStateUpdate)
          wsClient.on('initial_state', onStateUpdate)
          wsClient.on('viewer_status', updateStatus)
          wsClient.on('language_updated', onLanguageUpdate)
          // Подключаемся к SSE/WebSocket
          // Не пробрасываем ошибку наверх если это первая попытка подключения
          try {
            await wsClient.connect();
          } catch (error) {
            // SSE может не подключиться с первой попытки если controller ещё не создал сессию
            // Это нормально - RealtimeClient автоматически переподключится
            debugWarn("⚠️ First connection attempt failed, will retry:", error.message);
            // Не показываем ошибку пользователю - автоматический реконнект обработает это
          }
          // Use BallRenderer's built-in optimized loop
          if (ballRenderer) {
             ballRenderer.start();
          }
          setupEventListeners();
          // Auto-hide hotkeys hint after 10 seconds
          setTimeout(() => {
            const hotkeysHint = document.getElementById('hotkeysHint');
            if (hotkeysHint) {
              hotkeysHint.classList.add('hidden');
            }
          }, 10000);
          debugLog("✅ Viewer успешно инициализирован");
        } catch (error) {
          debugError("❌ Ошибка инициализации viewer:", error);
          showError("Ошибка инициализации: " + error.message);
        }
      }
    </script>
  </body>
</html>
