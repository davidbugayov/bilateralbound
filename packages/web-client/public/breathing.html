<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Когерентное дыхание | CalmFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #breathCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .phase-label {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      transition: opacity 0.3s;
      margin-bottom: 0.5rem;
    }

    .timer-display {
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: rgba(255,255,255,0.4);
      font-variant-numeric: tabular-nums;
      margin-bottom: 2rem;
    }

    .cycle-counter {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: rgba(255,255,255,0.3);
      margin-top: 1rem;
    }

    .controls {
      position: absolute;
      bottom: max(2rem, env(safe-area-inset-bottom, 1rem));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      pointer-events: auto;
    }

    .btn {
      padding: 0.8rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 120px;
      text-align: center;
      pointer-events: auto;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    .btn-primary.active {
      background: #ef4444;
      border-color: #ef4444;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
    }

    .duration-selector {
      position: absolute;
      top: max(1.5rem, env(safe-area-inset-top, 1rem));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0 1rem;
      pointer-events: auto;
    }

    .duration-btn {
      padding: 0.4rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      pointer-events: auto;
    }

    .duration-btn.active {
      background: rgba(59,130,246,0.3);
      border-color: #3b82f6;
      color: white;
    }

    .duration-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* Кнопки сайтов — пилюли сверху слева */
    .site-pills {
      position: absolute;
      top: max(0.6rem, env(safe-area-inset-top, 0.5rem));
      left: 0.7rem;
      display: flex;
      flex-direction: row;
      gap: 0.3rem;
      z-index: 10;
      pointer-events: auto;
    }
    .site-pill {
      padding: 0.25rem 0.6rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.35);
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .site-pill:hover,
    .site-pill:active {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      border-color: rgba(255,255,255,0.2);
    }

    /* Кнопка звука */
    .btn-icon {
      width: 3rem;
      height: 3rem;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .btn-icon:active {
      transform: scale(0.9);
    }
    .btn-icon.muted {
      opacity: 0.4;
      border-color: rgba(255,255,255,0.06);
    }

    /* Инфо-карточка под кнопкой Старт */
    .info-card {
      position: absolute;
      bottom: max(6.5rem, calc(env(safe-area-inset-bottom, 1rem) + 5rem));
      left: 1.5rem;
      right: 1.5rem;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s, transform 0.5s;
      opacity: 1;
      transform: translateY(0);
    }
    .info-card.hidden {
      opacity: 0;
      transform: translateY(10px);
    }
    .info-card .butterfly-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .info-card .info-title {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.25rem;
      letter-spacing: 0.02em;
    }
    .info-card .info-subtitle {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      color: rgba(255,255,255,0.35);
      line-height: 1.5;
    }
    .info-card .info-subtitle span {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      margin: 0 0.15rem;
      border-radius: 12px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.2);
      color: rgba(255,255,255,0.5);
      font-size: clamp(0.65rem, 2vw, 0.75rem);
      font-variant-numeric: tabular-nums;
    }

    /* Сообщение о завершении */
    .complete-message {
      position: absolute;
      bottom: max(6.5rem, calc(env(safe-area-inset-bottom, 1rem) + 5rem));
      left: 1.5rem;
      right: 1.5rem;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .complete-message.show {
      opacity: 1;
    }
    .complete-message .check-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.3rem;
    }
    .complete-message .complete-text {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #10b981;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <canvas id="breathCanvas"></canvas>

  <div class="duration-selector" id="durationSelector">
    <button class="duration-btn" data-minutes="1">1 мин</button>
    <button class="duration-btn active" data-minutes="3">3 мин</button>
    <button class="duration-btn" data-minutes="5">5 мин</button>
    <button class="duration-btn" data-minutes="10">10 мин</button>
  </div>

  <div class="overlay">
    <div class="phase-label" id="phaseLabel">Готов</div>
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="cycle-counter" id="cycleCounter">0 циклов</div>
  </div>

  <div class="site-pills">
    <button class="site-pill" id="siteBtnOnline">🌐 .online</button>
    <button class="site-pill" id="siteBtnRu">🌐 .ru</button>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">🌬️ Начать</button>
    <button class="btn-icon" id="muteBtn" title="Звук тиков">🔊</button>
  </div>

  <!-- Инфо-карточка с инструкцией Butterfly Hug -->
  <div class="info-card" id="infoCard">
    <span class="butterfly-icon">🦋</span>
    <div class="info-title">Butterfly Hug</div>
    <div class="info-subtitle">
      Скрести руки на груди и дыши<br>в ритм анимации
    </div>
    <div class="info-subtitle" style="margin-top:0.6rem">
      <span>Вдох 5с</span> <span style="opacity:0.3">⟷</span> <span>Выдох 5с</span>
    </div>
  </div>

  <!-- Сообщение о завершении -->
  <div class="complete-message" id="completeMessage">
    <span class="check-icon">✅</span>
    <div class="complete-text">Сессия завершена</div>
  </div>

  <script src="/js/breathing/breathing-engine.js"></script>
  <script>
    (function() {
      'use strict'

      // ── DOM refs ──
      const canvas = document.getElementById('breathCanvas')
      const ctx = canvas.getContext('2d')
      const phaseLabel = document.getElementById('phaseLabel')
      const timerDisplay = document.getElementById('timerDisplay')
      const cycleCounter = document.getElementById('cycleCounter')
      const startBtn = document.getElementById('startBtn')
      const muteBtn = document.getElementById('muteBtn')
      const siteBtnOnline = document.getElementById('siteBtnOnline')
      const siteBtnRu = document.getElementById('siteBtnRu')
      const infoCard = document.getElementById('infoCard')
      const completeMessage = document.getElementById('completeMessage')
      const durationBtns = document.querySelectorAll('.duration-btn')

      // ── State ──
      let selectedMinutes = 3
      let animFrameId = null
      let lastTs = 0
      let windowWidth = window.innerWidth
      let windowHeight = window.innerHeight

      // ── Engine ──
      const engine = new BreathingEngine({
        inhaleSec: 5,
        exhaleSec: 5,
        bpm: 30
      })

      // ── Telegram WebApp ──
      let tg = null
      try {
        if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
          tg = window.Telegram.WebApp
          tg.ready()
          tg.expand()
        }
      } catch (e) { /* ignore */ }

      // ── Canvas resize ──
      function resizeCanvas() {
        windowWidth = window.innerWidth
        windowHeight = window.innerHeight
        canvas.width = windowWidth
        canvas.height = windowHeight
        drawIdle()
      }

      window.addEventListener('resize', resizeCanvas)
      resizeCanvas()

      // ── Drawing ──
      function drawCircle(progress, phase) {
        const cx = canvas.width / 2
        const cy = canvas.height / 2
        const maxR = Math.min(cx, cy) * 0.75
        const minR = maxR * 0.15
        // progress 0..1 от smoothstep в engine
        const radius = minR + (maxR - minR) * progress

        // Цвет в зависимости от фазы
        let color1, color2
        if (phase === 'inhale') {
          color1 = '#3b82f6'
          color2 = '#1d4ed8'
        } else if (phase === 'exhale') {
          color1 = '#8b5cf6'
          color2 = '#6d28d9'
        } else if (phase === 'hold_in' || phase === 'hold_out') {
          color1 = '#60a5fa'
          color2 = '#2563eb'
        } else {
          color1 = '#1e293b'
          color2 = '#0f172a'
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height)

        // Glow
        const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 1.2)
        gradient.addColorStop(0, color1 + '33')
        gradient.addColorStop(0.5, color2 + '11')
        gradient.addColorStop(1, 'transparent')
        ctx.fillStyle = gradient
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Circle
        const g = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, 0, cx, cy, radius)
        g.addColorStop(0, color1)
        g.addColorStop(1, color2)
        ctx.shadowColor = color1 + '66'
        ctx.shadowBlur = radius * 0.5
        ctx.beginPath()
        ctx.arc(cx, cy, radius, 0, Math.PI * 2)
        ctx.fillStyle = g
        ctx.fill()
        ctx.shadowBlur = 0

        // Pulse ring
        if (engine.running) {
          const pulseSize = radius + 8 + Math.sin(performance.now() / 200) * 4
          ctx.beginPath()
          ctx.arc(cx, cy, pulseSize, 0, Math.PI * 2)
          ctx.strokeStyle = color1 + '44'
          ctx.lineWidth = 2
          ctx.stroke()
        }
      }

      function drawIdle() {
        drawCircle(0.15, 'idle')
      }

      // ── UI update ──
      function updateUI() {
        const stats = engine.getStats()
        phaseLabel.textContent = engine.getPhaseLabel('ru')

        if (stats.running) {
          const mins = Math.floor(stats.elapsedSec / 60)
          const secs = stats.elapsedSec % 60
          timerDisplay.textContent = mins + ':' + String(secs).padStart(2, '0')
          cycleCounter.textContent = stats.cycleCount + ' циклов'
        } else {
          timerDisplay.textContent = '0:00'
          cycleCounter.textContent = '0 циклов'
        }
      }

      // ── Animation loop ──
      function loop(timestamp) {
        if (!lastTs) lastTs = timestamp
        const delta = timestamp - lastTs
        lastTs = timestamp

        if (engine.running) {
          engine.update(delta)
          const progress = engine.getCircleRadius()
          drawCircle(progress, engine.phase)
          updateUI()
        }

        animFrameId = requestAnimationFrame(loop)
      }

      function startAnimation() {
        if (animFrameId) cancelAnimationFrame(animFrameId)
        lastTs = 0
        animFrameId = requestAnimationFrame(loop)
      }

      // ── Controls ──
      function startBreathing() {
        if (engine.running) {
          engine.stop()
          startBtn.textContent = '🌬️ Начать'
          startBtn.classList.remove('active')
          enableDurationButtons()
          infoCard.classList.remove('hidden')
          completeMessage.classList.remove('show')
          drawIdle()
          return
        }

        // User gesture → init AudioContext
        if (engine.audioContext && engine.audioContext.state === 'suspended') {
          engine.audioContext.resume()
        }

        engine.start(selectedMinutes)
        startBtn.textContent = '⏹ Стоп'
        startBtn.classList.add('active')
        disableDurationButtons()
        infoCard.classList.add('hidden')
        completeMessage.classList.remove('show')
        startAnimation()
      }

      function disableDurationButtons() {
        durationBtns.forEach(function(b) { b.disabled = true })
      }

      function enableDurationButtons() {
        durationBtns.forEach(function(b) { b.disabled = false })
      }

      // ── Mute toggle ──
      muteBtn.addEventListener('click', function() {
        const nowMuted = engine.toggleMute()
        muteBtn.textContent = nowMuted ? '🔇' : '🔊'
        muteBtn.classList.toggle('muted', nowMuted)
        muteBtn.title = nowMuted ? 'Включить звук' : 'Отключить звук'
      })

      // ── Events ──
      startBtn.addEventListener('click', startBreathing)

      durationBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          durationBtns.forEach(function(b) { b.classList.remove('active') })
          btn.classList.add('active')
          selectedMinutes = parseInt(btn.dataset.minutes, 10)
        })
      })

      function goToSite(url) {
        if (engine.running) engine.stop()
        if (tg) {
          tg.openLink(url, { try_instant_view: false })
        } else {
          window.location.href = url
        }
      }

      siteBtnOnline.addEventListener('click', function() {
        goToSite('https://emdrbilateral.online')
      })

      siteBtnRu.addEventListener('click', function() {
        goToSite('https://emdrbilateral.ru')
      })

      // Engine callbacks
      engine.onPhaseChange = function(phase) {
        phaseLabel.textContent = engine.getPhaseLabel('ru')
      }

      engine.onComplete = function() {
        startBtn.textContent = '✅ Завершено'
        startBtn.classList.remove('active')
        startBtn.style.background = '#10b981'
        startBtn.style.borderColor = '#10b981'
        startBtn.style.display = 'none'
        enableDurationButtons()
        completeMessage.classList.add('show')
        setTimeout(function() {
          startBtn.textContent = '🌬️ Начать'
          startBtn.style.background = ''
          startBtn.style.borderColor = ''
          startBtn.style.display = ''
          completeMessage.classList.remove('show')
          infoCard.classList.remove('hidden')
        }, 4000)
      }

      // ── Init ──
      drawIdle()
      startAnimation()
    })()
  </script>
</body>
</html>
