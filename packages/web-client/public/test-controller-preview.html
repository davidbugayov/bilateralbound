<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Test Controller Preview</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }
    #status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    #log {
      border: 1px solid #ccc;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      background: #f5f5f5;
    }
    .log-entry {
      margin: 2px 0;
      padding: 2px;
    }
    .log-preview { color: #0066cc; }
    .log-engine { color: #009900; }
    .log-error { color: #cc0000; font-weight: bold; }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🧪 Controller Preview Test</h1>

  <div id="status" class="info">Initializing...</div>

  <div>
    <button onclick="startTest()">▶ Start Test</button>
    <button onclick="togglePlay()">⏯ Toggle Play/Pause</button>
    <button onclick="clearLog()">🗑 Clear Log</button>
  </div>

  <h2>Preview Canvas</h2>
  <canvas id="testCanvas" width="800" height="600" style="border: 2px solid #333;"></canvas>

  <h2>Debug Log</h2>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log')
    const statusEl = document.getElementById('status')

    function log(msg, type = 'info') {
      const entry = document.createElement('div')
      entry.className = `log-entry log-${type}`
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      logEl.appendChild(entry)
      logEl.scrollTop = logEl.scrollHeight
      console.log(msg)
    }

    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg
      statusEl.className = type
    }

    function clearLog() {
      logEl.innerHTML = ''
    }

    // Перехватываем console.log для отображения Preview/Engine логов
    const originalLog = console.log
    console.log = function(...args) {
      originalLog.apply(console, args)
      const msg = args.join(' ')
      if (msg.includes('[Preview]')) {
        log(msg, 'preview')
      } else if (msg.includes('[PhysicsEngine]')) {
        log(msg, 'engine')
      }
    }

    const originalError = console.error
    console.error = function(...args) {
      originalError.apply(console, args)
      log(args.join(' '), 'error')
    }

    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script')
        script.src = src
        script.onload = resolve
        script.onerror = reject
        document.head.appendChild(script)
      })
    }

    async function startTest() {
      try {
        setStatus('Loading scripts...', 'info')
        log('Loading physics engine...')

        // Загружаем необходимые скрипты
        await loadScript('/js/physics-engine.js')
        await loadScript('/js/renderer/render-strategies.js')

        log('Scripts loaded')

        // Создаем движок физики в viewer режиме с clientSimulation: true
        log('Creating PhysicsEngine (isViewer: true, clientSimulation: true)...')
        const engine = new PhysicsEngine({
          isViewer: true,
          clientSimulation: true,
          worldWidth: 800,
          worldHeight: 600
        })

        window.__testEngine = engine

        log(`Engine created: worldSize=${engine.options.worldWidth}x${engine.options.worldHeight}`)
        log(`Engine mode: isViewer=${engine.isViewer}, clientSimulation=${engine.options.clientSimulation}`)
        log(`Ball position: (${engine.ball.x.toFixed(1)}, ${engine.ball.y.toFixed(1)})`)
        log(`Ball paused: ${engine.state.paused}`)

        // Создаем рендерер
        const canvas = document.getElementById('testCanvas')
        log('Creating BallRenderer...')
        const renderer = new BallRenderer(canvas, engine, { localPhysics: false })
        window.__testRenderer = renderer

        log('Renderer created')

        // Запускаем цикл физики и рендеринга
        const PHYSICS_DT = 1000 / 60

        setInterval(() => {
          if (engine) {
            engine.update(PHYSICS_DT / 1000)
          }
        }, PHYSICS_DT)

        function renderLoop() {
          if (engine && renderer) {
            const ballState = engine.getBallState()
            renderer.drawFrame(ballState)
          }
          requestAnimationFrame(renderLoop)
        }

        renderLoop()

        setStatus('✅ Test running! Check console and log below.', 'success')
        log('Test started successfully')

      } catch (error) {
        setStatus(`❌ Error: ${error.message}`, 'error')
        log(`ERROR: ${error.message}`, 'error')
        console.error(error)
      }
    }

    function togglePlay() {
      const engine = window.__testEngine
      if (!engine) {
        log('Engine not initialized', 'error')
        return
      }

      const wasPaused = engine.state.paused
      engine.setPaused(!wasPaused)

      if (wasPaused) {
        // Устанавливаем направление (горизонтально)
        engine.setDirection(1, 0)
        log('▶ Playing: direction=(1, 0), speed=' + engine.ball.speed)
      } else {
        log('⏸ Paused')
      }

      log(`Ball state after toggle: pos=(${engine.ball.x.toFixed(1)}, ${engine.ball.y.toFixed(1)}), vel=(${engine.ball.vx?.toFixed(1)}, ${engine.ball.vy?.toFixed(1)})`)
    }

    // Автозапуск через 1 секунду
    setTimeout(startTest, 1000)
  </script>
</body>
</html>
