name: Deploy to Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --ignore-scripts
      - run: npm run lint

  deploy:
    name: Deploy to dev.emdrbilateral.online
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 144.31.68.9 >> ~/.ssh/known_hosts 2>/dev/null

          # Write key ensuring proper format
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verify key is valid
          ssh-keygen -l -f ~/.ssh/deploy_key || { echo "ERROR: Key format invalid"; exit 1; }

          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

          echo "=== Syncing code ==="
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude dist \
            --exclude .scannerwork \
            --exclude test-results \
            --exclude data \
            --exclude .github \
            -e "$SSH_CMD" \
            ${{ github.workspace }}/ root@144.31.68.9:/var/www/dev.emdrbilateral.online/

          echo "=== Installing and building ==="
          $SSH_CMD root@144.31.68.9 << 'SCRIPT'
          set -e
          cd /var/www/dev.emdrbilateral.online
          npm install --ignore-scripts
          cd packages/web-client
          npm install --ignore-scripts
          cd /var/www/dev.emdrbilateral.online
          npm run build:prod
          systemctl restart emdrbilateral-dev
          sleep 3
          SCRIPT

          echo "=== Health check ==="
          for i in $(seq 1 30); do
            STATUS=$($SSH_CMD root@144.31.68.9 "systemctl is-active emdrbilateral-dev" 2>/dev/null)
            if [ "$STATUS" = "active" ]; then
              echo "Service is running"
              $SSH_CMD root@144.31.68.9 "curl -s -o /dev/null -w 'HTTP %{http_code}' http://localhost:3003/"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Service failed to start"
          exit 1
