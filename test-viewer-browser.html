<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Viewer Sync</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .ball-info { background: #e7f3ff; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Тест синхронизации вьювера</h1>

    <div>
        <button onclick="startTest()">🚀 Начать тест</button>
        <button onclick="clearLog()">🧹 Очистить лог</button>
    </div>

    <div class="status" id="connectionStatus">
        ⏳ Подключение к серверу...
    </div>

    <div class="ball-info" id="ballInfo">
        Мяч: vx=0, vy=0, paused=true
    </div>

    <div class="log" id="log">
        Ждем начала тестирования...
    </div>

    <script src="public/js/session-poller.js"></script>
    <script>
        let poller = null;
        let sessionId = null;
        let physics = { ball: { vx: 0, vy: 0 }, paused: true };

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = {
                'info': 'ℹ️',
                'success': '✅',
                'error': '❌',
                'data': '📊'
            }[type] || '📝';

            logEl.innerHTML += `<div>[${timestamp}] ${prefix} ${message}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateConnectionStatus(data) {
            const statusEl = document.getElementById('connectionStatus');
            if (data.controllerConnected) {
                statusEl.className = 'status connected';
                statusEl.innerHTML = '🎮 Контроллер подключен';
            } else {
                statusEl.className = 'status disconnected';
                statusEl.innerHTML = '⏳ Ожидание контроллера...';
            }
        }

        function updateBallState(data) {
            log(`Получены данные мяча: vx=${data.vx}, vy=${data.vy}, paused=${data.paused}`, 'data');

            // Обновляем локальное состояние
            if (data.vx !== undefined) physics.ball.vx = data.vx;
            if (data.vy !== undefined) physics.ball.vy = data.vy;
            if (data.paused !== undefined) physics.paused = data.paused;

            // Обновляем отображение
            document.getElementById('ballInfo').innerHTML =
                `Мяч: vx=${physics.ball.vx}, vy=${physics.ball.vy}, paused=${physics.paused}`;
        }

        async function startTest() {
            try {
                log('Начинаем тест синхронизации...');

                // 1. Создаем сессию
                log('Создание сессии...');
                const sessionResponse = await fetch('/api/session', { method: 'POST' });
                const sessionData = await sessionResponse.json();
                sessionId = sessionData.sessionId;
                log(`Сессия создана: ${sessionId}`, 'success');

                // 2. Подключаем контроллер
                log('Подключение контроллера...');
                await fetch(`/api/session/${sessionId}/controller/connect`, { method: 'POST' });
                log('Контроллер подключен', 'success');

                // 3. Подключаем вьювер
                log('Подключение вьювера...');
                await fetch(`/api/session/${sessionId}/viewer/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ screenSize: { width: 1920, height: 1080 } })
                });
                log('Вьювер подключен', 'success');

                // 4. Запускаем SessionPoller
                log('Запуск SessionPoller...');
                poller = new SessionPoller({
                    sessionId: sessionId,
                    pollInterval: 200, // 200ms для тестирования
                    onDataReceived: (data) => {
                        log('onDataReceived вызван', 'data');
                        updateConnectionStatus(data);
                    },
                    onStateReceived: (data) => {
                        log('onStateReceived вызван', 'data');
                        updateBallState(data);
                    },
                    onSessionExpired: () => {
                        log('Сессия истекла', 'error');
                    },
                    onError: (error) => {
                        log(`Ошибка: ${error.message}`, 'error');
                    }
                });

                poller.startPolling();
                log('SessionPoller запущен', 'success');

                // 5. Отправляем тестовые команды
                setTimeout(async () => {
                    log('Отправка команды запуска мяча...');
                    await fetch(`/api/session/${sessionId}/controller/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            resume: true,
                            dirX: 1,
                            dirY: 0,
                            speedScalar: 200
                        })
                    });
                    log('Команда запуска отправлена', 'success');
                }, 2000);

                setTimeout(async () => {
                    log('Отправка команды паузы...');
                    await fetch(`/api/session/${sessionId}/controller/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pause: true })
                    });
                    log('Команда паузы отправлена', 'success');
                }, 5000);

            } catch (error) {
                log(`Ошибка теста: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Автоматический запуск при загрузке страницы
        window.addEventListener('load', () => {
            log('Тестовая страница загружена. Нажмите "Начать тест" для проверки синхронизации.');
        });
    </script>
</body>
</html>
