<!-- Общий компонент кнопки для BilateralBound -->
<button 
  class="btn {{className}}" 
  id="{{id}}" 
  {{disabled}}
  {{attributes}}
>
  {{icon}}{{text}}
</button>

<style>
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  min-height: 44px;
  user-select: none;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: #3b82f6;
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: #2563eb;
  transform: translateY(-1px);
}

.btn-secondary {
  background: #6b7280;
  color: white;
}

.btn-secondary:hover:not(:disabled) {
  background: #4b5563;
  transform: translateY(-1px);
}

.btn-success {
  background: #10b981;
  color: white;
}

.btn-success:hover:not(:disabled) {
  background: #059669;
  transform: translateY(-1px);
}

.btn-danger {
  background: #ef4444;
  color: white;
}

.btn-danger:hover:not(:disabled) {
  background: #dc2626;
  transform: translateY(-1px);
}

.btn-outline {
  background: transparent;
  border: 2px solid #3b82f6;
  color: #3b82f6;
}

.btn-outline:hover:not(:disabled) {
  background: #3b82f6;
  color: white;
}

.btn-sm {
  padding: 8px 16px;
  font-size: 12px;
  min-height: 36px;
}

.btn-lg {
  padding: 16px 24px;
  font-size: 16px;
  min-height: 52px;
}

.btn-full {
  width: 100%;
}

.btn-icon {
  padding: 8px;
  min-width: 44px;
  min-height: 44px;
}

@media (max-width: 768px) {
  .btn {
    padding: 10px 16px;
    font-size: 13px;
    min-height: 40px;
  }
  
  .btn-sm {
    padding: 6px 12px;
    font-size: 11px;
    min-height: 32px;
  }
  
  .btn-lg {
    padding: 14px 20px;
    font-size: 15px;
    min-height: 48px;
  }
}
</style>
