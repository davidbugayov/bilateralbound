<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Тест WebSocket подключения</h1>

    <div>
        <button onclick="testConnection()">Тестировать подключение</button>
        <button onclick="testSession()">Создать сессию</button>
        <button onclick="testJoinController()">Присоединиться как контроллер</button>
        <button onclick="testJoinViewer()">Присоединиться как viewer</button>
    </div>

    <div id="logs"></div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
    <script>
        let socket;
        let sessionId = 'test' + Date.now();

        function log(message, type = '') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logs.appendChild(div);
            console.log(message);
        }

        function testConnection() {
            log('Подключение к WebSocket...');

            socket = io('http://localhost:3000');

            socket.on('connect', () => {
                log('✅ WebSocket подключен! Socket ID: ' + socket.id, 'success');
            });

            socket.on('disconnect', () => {
                log('❌ WebSocket отключен', 'error');
            });

            socket.on('error-message', (msg) => {
                log('❌ Ошибка: ' + msg, 'error');
            });

            socket.on('role-update', (data) => {
                log('📢 Role update: ' + JSON.stringify(data), 'success');
            });

            socket.on('ball-state', (data) => {
                log('⚽ Ball state: ' + JSON.stringify(data), 'success');
            });
        }

        function testSession() {
            log('Создание сессии: ' + sessionId);

            fetch('/api/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId })
            })
            .then(r => r.json())
            .then(data => log('✅ Сессия создана: ' + JSON.stringify(data), 'success'))
            .catch(err => log('❌ Ошибка создания сессии: ' + err, 'error'));
        }

        function testJoinController() {
            if (!socket) {
                log('❌ Сначала подключитесь к WebSocket', 'error');
                return;
            }

            log('Присоединение как контроллер к сессии: ' + sessionId);

            socket.emit('join-session', {
                sessionId: sessionId,
                role: 'controller'
            });
        }

        function testJoinViewer() {
            if (!socket) {
                log('❌ Сначала подключитесь к WebSocket', 'error');
                return;
            }

            log('Присоединение как viewer к сессии: ' + sessionId);

            socket.emit('join-session', {
                sessionId: sessionId,
                role: 'viewer'
            });
        }

        // Автоматический тест при загрузке
        window.onload = function() {
            log('Страница загружена. Нажмите "Тестировать подключение" для начала.');
        };
    </script>
</body>
</html>
