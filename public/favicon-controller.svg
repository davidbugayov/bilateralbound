<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .controller-fill { fill: #10b981; }
      .controller-stroke { fill: none; stroke: #10b981; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .button { fill: #ef4444; }
    </style>
  </defs>

  <!-- Controller base -->
  <rect class="controller-stroke" x="6" y="12" width="20" height="12" rx="3"/>
  <!-- Left handle -->
  <rect class="controller-stroke" x="2" y="16" width="6" height="4" rx="2"/>
  <!-- Right handle -->
  <rect class="controller-stroke" x="24" y="16" width="6" height="4" rx="2"/>
  <!-- Left button -->
  <circle class="button" cx="12" cy="16" r="2"/>
  <!-- Right button -->
  <circle class="button" cx="20" cy="16" r="2"/>
  <!-- D-pad -->
  <path class="controller-stroke" d="M8 20l2-2h4l2 2v4l-2 2h-4l-2-2z"/>
  <!-- Start button -->
  <circle class="controller-fill" cx="16" cy="24" r="1.5"/>
</svg>
