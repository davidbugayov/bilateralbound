<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="BilateralBound - Просмотр движения шарика в реальном времени" />
    <meta name="keywords" content="bilateral, bound, viewer, real-time, ball, movement" />
    <title>BilateralBound - Просмотр</title>
    
    <!-- ===== STYLES ===== -->
    <link rel="stylesheet" href="/css/shared-components.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0; 
            padding: 0;
            background: #020617;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== LAYOUT ===== */
        .viewer-container {
            flex: 1;
            position: relative;
            background: #020617;
        }

        .viewer-canvas {
            width: 100%; 
            height: 100%; 
            background: #020617; 
            display: block; 
        }

        /* ===== OVERLAYS ===== */
        .status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .status-online {
            border-color: #22c55e;
            color: #22c55e;
        }

        .status-offline {
            border-color: #ef4444;
            color: #ef4444;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            max-width: 300px;
        }

        /* ===== CONTROLS ===== */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        /* ===== LOADING ===== */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 999;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .status-overlay {
                top: 12px;
                left: 12px;
                padding: 12px 18px;
                font-size: 14px;
                border-radius: 12px;
                max-width: calc(100vw - 120px);
            }

            .instructions {
                bottom: 12px;
                left: 12px;
                padding: 12px 18px;
                font-size: 13px;
                max-width: calc(100vw - 120px);
                border-radius: 12px;
            }

            .fullscreen-btn {
                top: 12px;
                right: 12px;
                padding: 12px 16px;
                font-size: 13px;
                border-radius: 10px;
                min-width: 140px;
                touch-action: manipulation;
                transition: all 0.2s ease;
            }

            .fullscreen-btn:active {
                transform: scale(0.95);
                background: rgba(0, 0, 0, 0.9);
            }
        }

        @media (max-width: 480px) {
            .status-overlay {
                top: 8px;
                left: 8px;
                padding: 10px 14px;
                font-size: 12px;
                border-radius: 10px;
            }

            .instructions {
                bottom: 8px;
                left: 8px;
                padding: 10px 14px;
                font-size: 12px;
                border-radius: 10px;
            }

            .fullscreen-btn {
                top: 8px;
                right: 8px;
                padding: 10px 14px;
                font-size: 12px;
                min-width: 120px;
                border-radius: 8px;
            }

            .sessionInfo {
                font-size: 11px !important;
            }
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="viewer-container">
        <!-- ===== CANVAS ===== -->
        <canvas id="viewerCanvas" class="viewer-canvas"></canvas>
        
        <!-- ===== STATUS OVERLAY ===== -->
        <div id="statusContainer"></div>
        
        <!-- ===== INSTRUCTIONS ===== -->
        <div class="instructions fade-in">
            <strong>📱 Управление:</strong><br>
            • <strong>Двойной тап</strong> - полноэкранный режим<br>
            • <strong>Прокрутка</strong> - масштабирование вида<br>
            • <strong>Перетаскивание</strong> - перемещение по сцене<br>
            <span id="mobileHint" style="font-size: 11px; opacity: 0.8; display: block; margin-top: 4px;">💡 Используйте контроллер для управления движением</span>
        </div>
        
        <!-- ===== FULLSCREEN BUTTON ===== -->
        <button class="fullscreen-btn" onclick="toggleFullscreen()">
            ⛶ Полноэкранный
        </button>
        
        <!-- ===== LOADING ===== -->
        <div id="loading" class="loading">
            Загрузка...
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
      <script src="/js/common.js"></script>
  <script src="/js/physics-engine.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/session-sync.js"></script>
  <script src="/js/module-factory.js"></script>
  <script src="/js/shared-components.js"></script>
    
    <!-- ===== MAIN SCRIPT ===== -->
    <script>
        // ===== GLOBAL VARIABLES =====
        let physicsEngine;
        let renderer;
        let sessionSync;
        let sessionId;
        let isFullscreen = false;
        let components = {};
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 BilateralBound Viewer - Инициализация...');
            
            try {
                // Получаем sessionId из URL
                sessionId = getSessionIdFromUrl();
                if (!sessionId) {
                    showError('Session ID не найден в URL');
                    return;
                }
                
                console.log('📱 Session ID получен:', sessionId);
                
                // Инициализируем компоненты
                initializeComponents();
                
                // Инициализируем viewer
                await initializeViewer();
                
            } catch (error) {
                console.error('❌ Критическая ошибка инициализации:', error);
                showError('Ошибка инициализации: ' + error.message);
            }
        });
        
        // ===== COMPONENT INITIALIZATION =====
        function initializeComponents() {
            // Создаем компонент статуса
            components.status = sharedComponents.createStatusIndicator(
                document.getElementById('statusContainer'),
                {
                    title: 'Подключение...',
                    showIcon: true,
                    autoHide: false
                }
            );
        }
        
        // ===== CORE FUNCTIONS =====
        async function initializeViewer() {
            try {
                console.log('📱 Инициализация viewer для сессии:', sessionId);

                // Скрываем загрузку
                hideLoading();

                // Устанавливаем sessionId в глобальную переменную для совместимости
                if (!window.__current) {
                    window.__current = {};
                }
                window.__current.sessionId = sessionId;

                // Получаем canvas
                const canvas = document.getElementById('viewerCanvas');
                if (!canvas) {
                    throw new Error('Canvas не найден');
                }

                // Устанавливаем размер canvas
                resizeCanvas();

                // Создаем движок физики
                physicsEngine = new PhysicsEngine({
                    worldWidth: canvas.width,
                    worldHeight: canvas.height,
                    bounceCallback: syncBounce
                });

                // Создаем рендерер
                renderer = new BallRenderer(canvas, physicsEngine);

                // Создаем синхронизатор сессии
                sessionSync = new SessionSync({
                    sessionId: sessionId,
                    serverUrl: '',
                    onStateReceived: (serverState) => {
                        // Синхронизируем состояние с сервером
                        physicsEngine.syncFromServer(serverState);

                        // Обновляем статус
                        updateStatus(serverState);
                    },
                    onSessionExpired: handleSessionExpired,
                    onError: (error) => {
                        console.error('Session sync error:', error);
                        showError('Ошибка синхронизации: ' + error.message);
                    }
                });

                // Подключаемся к сессии
                await connectToSession();

                // Синхронизируем начальное состояние
                await syncInitialState();

                // Запускаем синхронизацию
                sessionSync.startPolling();

                // Запускаем рендеринг
                renderer.start();

                // Настраиваем event listeners
                setupEventListeners();

                console.log('✅ Viewer успешно инициализирован');

            } catch (error) {
                console.error('❌ Ошибка инициализации viewer:', error);
                showError('Ошибка инициализации: ' + error.message);
            }
        }
        
        // ===== SESSION MANAGEMENT =====
        async function syncInitialState() {
            if (!physicsEngine) return;

            try {
                const response = await fetch(`/api/session/${sessionId}/state`);
                if (!response.ok) {
                    console.warn('Не удалось получить состояние сессии:', response.status);
                    return;
                }

                const ballState = await response.json();
                if (ballState) {
                    // Синхронизируем состояние через PhysicsEngine
                    physicsEngine.syncFromServer(ballState);
                    console.log('✅ Начальное состояние синхронизировано');
                }
            } catch (error) {
                console.error('Ошибка синхронизации начального состояния:', error);
            }
        }
        
        async function connectToSession() {
            try {
                // Получаем размеры canvas
                const canvasElement = document.getElementById('viewerCanvas');
                if (!canvasElement) {
                    throw new Error('Canvas не найден');
                }

                const response = await fetch(`/api/session/${sessionId}/viewer/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        screenSize: {
                            width: canvasElement.width,
                            height: canvasElement.height
                        }
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText || 'Не удалось подключиться к сессии'}`);
                }
                
                console.log('✅ Подключение к сессии успешно');
                
            } catch (error) {
                console.error('❌ Ошибка подключения к сессии:', error);
                throw error;
            }
        }
        
        // ===== POLLING =====

        
        // ===== UTILITY FUNCTIONS =====
        function resizeCanvas() {
            const canvas = document.getElementById('viewerCanvas');
            if (!canvas) return;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Обновляем размеры мира физики при изменении размера экрана
            if (physicsEngine) {
                physicsEngine.setWorldSize(canvas.width, canvas.height);
            }

            // Обновляем рендерер
            if (renderer) {
                renderer.resize(canvas.width, canvas.height);
            }

            // Отправляем новые размеры экрана на сервер
            updateScreenSize();
        }

        // ===== BOUNCE SYNCHRONIZATION =====
        async function syncBounce(bounceData) {
            if (sessionSync) {
                try {
                    await sessionSync.syncBounce(bounceData);
                    console.log('✅ Отскок синхронизирован с сервером');
                } catch (error) {
                    console.error('Ошибка при синхронизации отскока:', error);
                }
            }
        }
        
        async function updateScreenSize() {
            try {
                const response = await fetch(`/api/session/${sessionId}/viewer/screen-size`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: canvas.width,
                        height: canvas.height
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    const errorMessage = `HTTP ${response.status}: ${errorText || 'Неизвестная ошибка'}`;
                    showWarning(`Не удалось обновить размер экрана: ${errorMessage}`);
                    return;
                }

                console.log('✅ Размер экрана обновлен на сервере');
            } catch (error) {
                console.error('Ошибка сети при обновлении размера экрана:', error);
            }
        }
        
        function updateStatus(sessionData) {
            if (components.status) {
                if (sessionData.controllerConnected) {
                    components.status.setStatus('success', 'Контроллер подключен');
                } else {
                    components.status.setStatus('error', 'Контроллер отключен');
                }
            }
        }
        
        function handleSessionExpired() {
            showError('Сессия истекла или была удалена');
        }
        
        function showError(message) {
            if (components.status) {
                components.status.setStatus('error', message);
            }
        }

        function showWarning(message) {
            console.warn('⚠️ Предупреждение viewer:', message);
            // Можно добавить визуальное предупреждение, если нужно
        }
        
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }
        
        function getSessionIdFromUrl() {
            const pathParts = window.location.pathname.split('/');
            const sessionId = pathParts[pathParts.length - 1] || null;
            
            // Проверяем, что sessionId не пустой и содержит только допустимые символы
            if (sessionId && sessionId.trim() && /^[a-zA-Z0-9]+$/.test(sessionId)) {
                return sessionId;
            }
            
            // Попробуем получить из query параметров
            const urlParams = new URLSearchParams(window.location.search);
            const querySessionId = urlParams.get('session');
            if (querySessionId && /^[a-zA-Z0-9]+$/.test(querySessionId)) {
                return querySessionId;
            }
            
            return null;
        }
        
        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            // Тактильная обратная связь
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            if (!isFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // ===== MOBILE ENHANCEMENTS =====
        function enhanceMobileUX() {
            // Предотвращаем зум при двойном тапе
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);

            // Улучшенная кнопка полноэкранного режима
            const fullscreenBtn = document.querySelector('.fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                    this.style.background = 'rgba(0, 0, 0, 0.9)';
                });

                fullscreenBtn.addEventListener('touchend', function() {
                    this.style.transform = '';
                    this.style.background = 'rgba(0, 0, 0, 0.8)';
                });
            }

            // Обновляем текст кнопки полноэкранного режима
            document.addEventListener('fullscreenchange', function() {
                isFullscreen = !!document.fullscreenElement || !!document.webkitFullscreenElement || !!document.msFullscreenElement;
                const btn = document.querySelector('.fullscreen-btn');
                if (btn) {
                    btn.textContent = isFullscreen ? '⛶ Выйти' : '⛶ Полноэкранный';
                }
            });
        }
        
        // ===== EVENT LISTENERS =====
        // Добавляем event listeners только после инициализации
        function setupEventListeners() {
            if (window) {
                window.addEventListener('resize', resizeCanvas);
            }

            if (document) {
                // Мобильные улучшения
                enhanceMobileUX();

                // Предотвращаем зум на мобильных устройствах
                document.addEventListener('gesturestart', function(event) {
                    event.preventDefault();
                });

                document.addEventListener('gesturechange', function(event) {
                    event.preventDefault();
                });

                document.addEventListener('gestureend', function(event) {
                    event.preventDefault();
                });
            }
        }
        
        // Двойной тап для полноэкранного режима с улучшенной обратной связью
        let lastTap = 0;
        let tapCount = 0;
        if (canvas) {
            canvas.addEventListener('touchend', function(event) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;

                if (tapLength < 500 && tapLength > 0) {
                    tapCount++;
                    if (tapCount === 2) {
                        event.preventDefault();
                        toggleFullscreen();

                        // Показываем уведомление о двойном тапе
                        const hint = document.getElementById('mobileHint');
                        if (hint) {
                            const originalText = hint.textContent;
                            hint.textContent = '✅ Полноэкранный режим активирован!';
                            hint.style.color = '#22c55e';
                            setTimeout(() => {
                                hint.textContent = originalText;
                                hint.style.color = '';
                            }, 2000);
                        }

                        tapCount = 0;
                    }
                } else {
                    tapCount = 1;
                }
                lastTap = currentTime;
            });
        }
        
        console.log('🎯 BilateralBound Viewer - Готов к работе');
    </script>
</body>
</html>
