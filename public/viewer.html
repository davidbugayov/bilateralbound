<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="BilateralBound - Просмотр движения шарика в реальном времени" />
    <meta name="keywords" content="bilateral, bound, viewer, real-time, ball, movement" />
    <title>BilateralBound - Просмотр</title>
    
    <!-- ===== STYLES ===== -->
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0; 
            padding: 0;
            background: #020617;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== LAYOUT ===== */
        .viewer-container {
            flex: 1;
            position: relative;
            background: #020617;
        }

        .viewer-canvas {
            width: 100%; 
            height: 100%; 
            background: #020617; 
            display: block; 
        }

        /* ===== OVERLAYS ===== */
        .status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .status-online {
            border-color: #22c55e;
            color: #22c55e;
        }

        .status-offline {
            border-color: #ef4444;
            color: #ef4444;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            max-width: 300px;
        }

        /* ===== CONTROLS ===== */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        /* ===== LOADING ===== */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 999;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .status-overlay {
                top: 12px;
                left: 12px;
                padding: 12px 18px;
                font-size: 14px;
                border-radius: 12px;
                max-width: calc(100vw - 120px);
            }

            .instructions {
                bottom: 12px;
                left: 12px;
                padding: 12px 18px;
                font-size: 13px;
                max-width: calc(100vw - 120px);
                border-radius: 12px;
            }

            .fullscreen-btn {
                top: 12px;
                right: 12px;
                padding: 12px 16px;
                font-size: 13px;
                border-radius: 10px;
                min-width: 140px;
                touch-action: manipulation;
                transition: all 0.2s ease;
            }

            .fullscreen-btn:active {
                transform: scale(0.95);
                background: rgba(0, 0, 0, 0.9);
            }
        }

        @media (max-width: 480px) {
            .status-overlay {
                top: 8px;
                left: 8px;
                padding: 10px 14px;
                font-size: 12px;
                border-radius: 10px;
            }

            .instructions {
                bottom: 8px;
                left: 8px;
                padding: 10px 14px;
                font-size: 12px;
                border-radius: 10px;
            }

            .fullscreen-btn {
                top: 8px;
                right: 8px;
                padding: 10px 14px;
                font-size: 12px;
                min-width: 120px;
                border-radius: 8px;
            }

            .sessionInfo {
                font-size: 11px !important;
            }
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="viewer-container">
        <!-- ===== CANVAS ===== -->
        <canvas id="viewerCanvas" class="viewer-canvas"></canvas>
        
        <!-- ===== STATUS OVERLAY ===== -->
        <div id="statusOverlay" class="status-overlay status-offline">
            <div id="statusText">Подключение...</div>
            <div id="sessionInfo" style="margin-top: 5px; font-size: 12px; opacity: 0.8;"></div>
        </div>
        
        <!-- ===== INSTRUCTIONS ===== -->
        <div class="instructions fade-in">
            <strong>📱 Управление:</strong><br>
            • <strong>Двойной тап</strong> - полноэкранный режим<br>
            • <strong>Прокрутка</strong> - масштабирование вида<br>
            • <strong>Перетаскивание</strong> - перемещение по сцене<br>
            <span id="mobileHint" style="font-size: 11px; opacity: 0.8; display: block; margin-top: 4px;">💡 Используйте контроллер для управления движением</span>
        </div>
        
        <!-- ===== FULLSCREEN BUTTON ===== -->
        <button class="fullscreen-btn" onclick="toggleFullscreen()">
            ⛶ Полноэкранный
        </button>
        
        <!-- ===== LOADING ===== -->
        <div id="loading" class="loading">
            Загрузка...
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/js/session-poller.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/physics.js"></script>
    
    <!-- ===== MAIN SCRIPT ===== -->
    <script>
        // ===== GLOBAL VARIABLES =====
        let canvas, ctx, physics;
        let sessionId;
        let isFullscreen = false;
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 BilateralBound Viewer - Инициализация...');
            
            try {
                // Получаем sessionId из URL
                sessionId = getSessionIdFromUrl();
                if (!sessionId) {
                    showError('Session ID не найден в URL');
                    return;
                }
                
                console.log('📱 Session ID получен:', sessionId);
                
                // Инициализируем viewer
                await initializeViewer();
                
            } catch (error) {
                console.error('❌ Критическая ошибка инициализации:', error);
                showError('Ошибка инициализации: ' + error.message);
            }
        });
        
        // ===== CORE FUNCTIONS =====
        async function initializeViewer() {
            try {
                console.log('📱 Инициализация viewer для сессии:', sessionId);
                
                // Скрываем загрузку
                hideLoading();
                
                // Устанавливаем sessionId в глобальную переменную для синхронизации отскоков
                if (!window.__current) {
                    window.__current = {};
                }
                window.__current.sessionId = sessionId;
                
                // Инициализируем canvas
                canvas = document.getElementById('viewerCanvas');
                ctx = canvas.getContext('2d');
                
                // Устанавливаем размер canvas
                resizeCanvas();
                
                // Инициализируем физику с размерами экрана вьювера
                physics = new BallPhysics();
                physics.setWorldSize(canvas.width, canvas.height);
                physics.setPosition(canvas.width / 2, canvas.height / 2);
                physics.setPaused(true);
                physics.lastDir = { x: 1, y: 0 };
                
                // Подключаемся к сессии
                await connectToSession();
                
                // Синхронизируем начальное состояние шара
                await syncInitialState();
                
                // Запускаем polling обновлений
                startStatePolling();
                
                // Запускаем рендеринг
                startRendering();
                
                // Настраиваем event listeners после инициализации
                setupEventListeners();
                
                console.log('✅ Viewer успешно инициализирован');
                
            } catch (error) {
                console.error('❌ Ошибка инициализации viewer:', error);
                showError('Ошибка инициализации: ' + error.message);
            }
        }
        
        // ===== SESSION MANAGEMENT =====
        async function syncInitialState() {
            try {
                const response = await fetch(`/api/session/${sessionId}/state`);
                if (!response.ok) {
                    console.warn('Не удалось получить состояние сессии:', response.status);
                    return;
                }
                
                const ballState = await response.json();
                if (ballState && physics) {
                    // Устанавливаем начальную позицию
                    physics.ball.x = ballState.x || canvas.width / 2;
                    physics.ball.y = ballState.y || canvas.height / 2;
                    
                    // Синхронизируем все параметры
                    if (ballState.speed !== undefined) physics.ball.speed = ballState.speed;
                    if (ballState.radius !== undefined) physics.ball.radius = ballState.radius;
                    if (ballState.colorBall) physics.colors.ball = ballState.colorBall;
                    if (ballState.colorBg) physics.colors.bg = ballState.colorBg;
                    if (ballState.paused !== undefined) physics.paused = ballState.paused;
                    
                    // Синхронизируем направление движения
                    if (ballState.vx !== undefined || ballState.vy !== undefined) {
                        physics.ball.vx = ballState.vx || 0;
                        physics.ball.vy = ballState.vy || 0;
                        const dirX = ballState.vx === 0 ? 0 : (ballState.vx > 0 ? 1 : -1);
                        const dirY = ballState.vy === 0 ? 0 : (ballState.vy > 0 ? 1 : -1);
                        physics.lastDir = { x: dirX, y: dirY };
                    }
                    
                    console.log('✅ Начальное состояние синхронизировано');
                }
            } catch (error) {
                console.error('Ошибка синхронизации начального состояния:', error);
            }
        }
        
        async function connectToSession() {
            try {
                // Проверяем, что canvas инициализирован
                if (!canvas) {
                    throw new Error('Canvas не инициализирован');
                }
                
                const response = await fetch(`/api/session/${sessionId}/viewer/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        screenSize: {
                            width: canvas.width,
                            height: canvas.height
                        }
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText || 'Не удалось подключиться к сессии'}`);
                }
                
                console.log('✅ Подключение к сессии успешно');
                
            } catch (error) {
                console.error('❌ Ошибка подключения к сессии:', error);
                throw error;
            }
        }
        
        // ===== POLLING =====
        function startStatePolling() {
            const poller = new SessionPoller({
                sessionId,
                onSessionExpired: handleSessionExpired,
                onDataReceived: (sessionData) => {
                    // Обновляем статус сессии
                    updateStatus(sessionData);
                    
                    // Применяем команды управления локально
                    if (physics && sessionData) {
                        // Синхронизация скорости и радиуса
                        if (sessionData.speed !== undefined) physics.ball.speed = sessionData.speed;
                        if (sessionData.radius !== undefined) physics.ball.radius = sessionData.radius;
                        if (sessionData.colorBall) physics.colors.ball = sessionData.colorBall;
                        if (sessionData.colorBg) physics.colors.bg = sessionData.colorBg;
                        if (sessionData.paused !== undefined) physics.paused = sessionData.paused;
                        
                        // Синхронизация направления движения и скорости
                        if (sessionData.vx !== undefined || sessionData.vy !== undefined) {
                            physics.ball.vx = sessionData.vx;
                            physics.ball.vy = sessionData.vy;
                            const dirX = sessionData.vx === 0 ? 0 : (sessionData.vx > 0 ? 1 : -1);
                            const dirY = sessionData.vy === 0 ? 0 : (sessionData.vy > 0 ? 1 : -1);
                            physics.lastDir = { x: dirX, y: dirY };
                        }
                    }
                }
            });
            
            poller.startPolling();
        }
        
        // ===== RENDERING =====
        function startRendering() {
            let lastTime = 0;
            const targetFrameTime = 1000 / 60; // 60 FPS
            let lastMovementTime = 0;
            
            function render(currentTime) {
                if (!canvas || !ctx || !physics) return;
                
                const deltaTime = currentTime - lastTime;
                
                // Очищаем canvas
                ctx.fillStyle = physics.colors.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Обновляем позицию мяча только при достаточном deltaTime
                if (deltaTime >= targetFrameTime) {
                    if (!physics.paused) {
                        // Используем physics.js для обновления позиции и обработки коллизий
                        const fixedDeltaTime = 1/60; // Фиксированный шаг времени
                        physics.updateWithDirection(
                            physics.lastDir.x,
                            physics.lastDir.y,
                            Math.sqrt(physics.ball.vx * physics.ball.vx + physics.ball.vy * physics.ball.vy) || physics.ball.speed,
                            fixedDeltaTime
                        );
                        
                        // Обновляем время последнего движения для потенциального использования
                        lastMovementTime = currentTime;
                    } else {
                        // Когда пауза, плавно центрируем мяч
                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        const centerSpeed = 3; // Пикселей в кадр
                        
                        if (Math.abs(physics.ball.x - centerX) > 1) {
                            physics.ball.x += Math.sign(centerX - physics.ball.x) * Math.min(centerSpeed, Math.abs(centerX - physics.ball.x));
                        }
                        if (Math.abs(physics.ball.y - centerY) > 1) {
                            physics.ball.y += Math.sign(centerY - physics.ball.y) * Math.min(centerSpeed, Math.abs(centerY - physics.ball.y));
                        }
                    }
                    lastTime = currentTime;
                }
                
                // Рисуем шарик
                ctx.beginPath();
                ctx.arc(physics.ball.x, physics.ball.y, physics.ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = physics.colors.ball;
                ctx.fill();
                
                requestAnimationFrame(render);
            }
            
            render();
        }
        
        // ===== UTILITY FUNCTIONS =====
        function resizeCanvas() {
            if (!canvas) return;
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Обновляем размеры мира физики при изменении размера экрана
            if (physics) {
                physics.setWorldSize(canvas.width, canvas.height);
            }
            
            // Отправляем новые размеры экрана на сервер
            updateScreenSize();
        }
        
        async function updateScreenSize() {
            try {
                await fetch(`/api/session/${sessionId}/viewer/screen-size`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: canvas.width,
                        height: canvas.height
                    })
                });
            } catch (error) {
                console.error('Ошибка обновления размера экрана:', error);
            }
        }
        
        function updateStatus(sessionData) {
            const statusOverlay = document.getElementById('statusOverlay');
            const statusText = document.getElementById('statusText');
            const sessionInfo = document.getElementById('sessionInfo');
            
            if (sessionData.controllerConnected) {
                statusOverlay.className = 'status-overlay status-online';
                statusText.textContent = '✅ Контроллер подключен';
            } else {
                statusOverlay.className = 'status-overlay status-offline';
                statusText.textContent = '❌ Контроллер отключен';
            }
            
            // Показываем информацию о сессии
            if (sessionData.sessionId) {
                sessionInfo.textContent = `Сессия: ${sessionData.sessionId}`;
            }
        }
        
        function handleSessionExpired() {
            showError('Сессия истекла или была удалена');
        }
        
        function showError(message) {
            const statusOverlay = document.getElementById('statusOverlay');
            statusOverlay.className = 'status-overlay status-offline';
            document.getElementById('statusText').textContent = '❌ ' + message;
        }
        
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }
        
        function getSessionIdFromUrl() {
            const pathParts = window.location.pathname.split('/');
            const sessionId = pathParts[pathParts.length - 1] || null;
            
            // Проверяем, что sessionId не пустой и содержит только допустимые символы
            if (sessionId && sessionId.trim() && /^[a-zA-Z0-9]+$/.test(sessionId)) {
                return sessionId;
            }
            
            // Попробуем получить из query параметров
            const urlParams = new URLSearchParams(window.location.search);
            const querySessionId = urlParams.get('session');
            if (querySessionId && /^[a-zA-Z0-9]+$/.test(querySessionId)) {
                return querySessionId;
            }
            
            return null;
        }
        
        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            // Тактильная обратная связь
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            if (!isFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // ===== MOBILE ENHANCEMENTS =====
        function enhanceMobileUX() {
            // Предотвращаем зум при двойном тапе
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);

            // Улучшенная кнопка полноэкранного режима
            const fullscreenBtn = document.querySelector('.fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                    this.style.background = 'rgba(0, 0, 0, 0.9)';
                });

                fullscreenBtn.addEventListener('touchend', function() {
                    this.style.transform = '';
                    this.style.background = 'rgba(0, 0, 0, 0.8)';
                });
            }

            // Обновляем текст кнопки полноэкранного режима
            document.addEventListener('fullscreenchange', function() {
                isFullscreen = !!document.fullscreenElement || !!document.webkitFullscreenElement || !!document.msFullscreenElement;
                const btn = document.querySelector('.fullscreen-btn');
                if (btn) {
                    btn.textContent = isFullscreen ? '⛶ Выйти' : '⛶ Полноэкранный';
                }
            });
        }
        
        // ===== EVENT LISTENERS =====
        // Добавляем event listeners только после инициализации
        function setupEventListeners() {
            if (window) {
                window.addEventListener('resize', resizeCanvas);
            }

            if (document) {
                // Мобильные улучшения
                enhanceMobileUX();

                // Предотвращаем зум на мобильных устройствах
                document.addEventListener('gesturestart', function(event) {
                    event.preventDefault();
                });

                document.addEventListener('gesturechange', function(event) {
                    event.preventDefault();
                });

                document.addEventListener('gestureend', function(event) {
                    event.preventDefault();
                });
            }
        }
        
        // Двойной тап для полноэкранного режима с улучшенной обратной связью
        let lastTap = 0;
        let tapCount = 0;
        if (canvas) {
            canvas.addEventListener('touchend', function(event) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;

                if (tapLength < 500 && tapLength > 0) {
                    tapCount++;
                    if (tapCount === 2) {
                        event.preventDefault();
                        toggleFullscreen();

                        // Показываем уведомление о двойном тапе
                        const hint = document.getElementById('mobileHint');
                        if (hint) {
                            const originalText = hint.textContent;
                            hint.textContent = '✅ Полноэкранный режим активирован!';
                            hint.style.color = '#22c55e';
                            setTimeout(() => {
                                hint.textContent = originalText;
                                hint.style.color = '';
                            }, 2000);
                        }

                        tapCount = 0;
                    }
                } else {
                    tapCount = 1;
                }
                lastTap = currentTime;
            });
        }
        
        console.log('🎯 BilateralBound Viewer - Готов к работе');
    </script>
</body>
</html>
