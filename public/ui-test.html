<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Test - BilateralBound</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.pass { background: #16a34a; color: white; }
        .status.fail { background: #dc2626; color: white; }
        .status.running { background: #ca8a04; color: white; }
        .logs {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 4px;
            border-radius: 2px;
        }
        .log-info { background: #1e40af; }
        .log-warn { background: #ca8a04; }
        .log-error { background: #dc2626; }
        .log-success { background: #16a34a; }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-start { background: #16a34a; color: white; }
        .btn-stop { background: #dc2626; color: white; }
        .btn-clear { background: #6b7280; color: white; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .metric {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
        }
        .metric-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 UI Test - BilateralBound</h1>
        <p>Автоматизированный тест для проверки движения мячика</p>

        <div class="controls">
            <button class="btn-start" onclick="startTest()">▶️ Запустить тест</button>
            <button class="btn-stop" onclick="stopTest()">⏹️ Остановить тест</button>
            <button class="btn-clear" onclick="clearLogs()">🗑️ Очистить логи</button>
        </div>

        <div class="test-section">
            <div class="test-header">
                <h3>📊 Метрики теста</h3>
                <div class="status" id="testStatus">Ожидание</div>
            </div>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="framesCount">0</div>
                    <div class="metric-label">Кадров обработано</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="bouncesCount">0</div>
                    <div class="metric-label">Отскоков</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="stuckTime">0</div>
                    <div class="metric-label">Время застревания (мс)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="avgSpeed">0</div>
                    <div class="metric-label">Средняя скорость</div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h3>📋 Логи тестирования</h3>
            <div class="logs" id="testLogs"></div>
        </div>

        <div class="test-section">
            <h3>🎯 Тестовое полотно</h3>
            <canvas id="testCanvas" width="800" height="600" style="border: 1px solid #334155; background: #020617;"></canvas>
        </div>
    </div>

    <script>
        // Глобальные переменные для теста
        let testRunning = false;
        let testStartTime = 0;
        let frameCount = 0;
        let bounceCount = 0;
        let stuckStartTime = 0;
        let totalStuckTime = 0;
        let lastPosition = { x: 0, y: 0 };
        let lastUpdateTime = 0;
        let speedHistory = [];
        let canvas, ctx;

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('testCanvas');
            ctx = canvas.getContext('2d');
            log('info', 'UI тест инициализирован');
        });

        // Функции логирования
        function log(type, message) {
            const logs = document.getElementById('testLogs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;

            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('testLogs').innerHTML = '';
        }

        // Обновление метрик
        function updateMetrics() {
            document.getElementById('framesCount').textContent = frameCount;
            document.getElementById('bouncesCount').textContent = bounceCount;
            document.getElementById('stuckTime').textContent = totalStuckTime.toFixed(0);

            const avgSpeed = speedHistory.length > 0 ?
                (speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length).toFixed(1) : 0;
            document.getElementById('avgSpeed').textContent = avgSpeed;
        }

        // Обновление статуса
        function updateStatus(status, text) {
            const statusEl = document.getElementById('testStatus');
            statusEl.className = `status status.${status}`;
            statusEl.textContent = text;
        }

        // Создание тестового мячика
        class TestBall {
            constructor() {
                this.x = 400;
                this.y = 300;
                this.vx = 250;
                this.vy = 0;
                this.radius = 40;
                this.color = '#60a5fa';
                this.worldWidth = 800;
                this.worldHeight = 600;
                this.edgePadding = 15;
                this.minSpeed = 250;
                this.lastBounceTime = 0;
            }

            update(dt) {
                const oldX = this.x;
                const oldY = this.y;

                // Обновляем позицию
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Проверяем столкновения с границами
                this.handleBoundaryCollisions();

                // Вычисляем скорость
                const dx = this.x - oldX;
                const dy = this.y - oldY;
                const speed = Math.sqrt(dx * dx + dy * dy) / dt;

                return speed;
            }

            handleBoundaryCollisions() {
                const radius = this.radius;
                let bounced = false;

                // Защита от множественных отскоков
                if (this.lastBounceTime && Date.now() - this.lastBounceTime < 32) {
                    return false;
                }

                // Левая граница
                if (this.x - radius <= 0) {
                    this.x = radius + this.edgePadding;
                    this.vx = Math.max(Math.abs(this.vx), this.minSpeed);
                    bounced = true;
                    log('success', `Отскок от ЛЕВОЙ границы: x=${this.x.toFixed(1)}, vx=${this.vx}`);
                }

                // Правая граница
                if (this.x + radius >= this.worldWidth) {
                    this.x = this.worldWidth - radius - this.edgePadding;
                    this.vx = -Math.max(Math.abs(this.vx), this.minSpeed);
                    bounced = true;
                    log('success', `Отскок от ПРАВОЙ границы: x=${this.x.toFixed(1)}, vx=${this.vx}`);
                }

                // Верхняя граница
                if (this.y - radius <= 0) {
                    this.y = radius + this.edgePadding;
                    this.vy = Math.max(Math.abs(this.vy), this.minSpeed);
                    bounced = true;
                    log('success', `Отскок от ВЕРХНЕЙ границы: y=${this.y.toFixed(1)}, vy=${this.vy}`);
                }

                // Нижняя граница
                if (this.y + radius >= this.worldHeight) {
                    this.y = this.worldHeight - radius - this.edgePadding;
                    this.vy = -Math.max(Math.abs(this.vy), this.minSpeed);
                    bounced = true;
                    log('success', `Отскок от НИЖНЕЙ границы: y=${this.y.toFixed(1)}, vy=${this.vy}`);
                }

                if (bounced) {
                    this.lastBounceTime = Date.now();
                    bounceCount++;
                }

                return bounced;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Детектор застревания
        class StuckDetector {
            constructor() {
                this.positions = [];
                this.maxHistory = 10;
                this.stuckThreshold = 2; // пикселей
                this.timeThreshold = 1000; // мс
            }

            addPosition(x, y) {
                this.positions.push({ x, y, time: Date.now() });

                if (this.positions.length > this.maxHistory) {
                    this.positions.shift();
                }

                return this.checkStuck();
            }

            checkStuck() {
                if (this.positions.length < this.maxHistory) return false;

                const recent = this.positions.slice(-5);
                const first = recent[0];
                const last = recent[recent.length - 1];

                const distance = Math.sqrt(
                    Math.pow(last.x - first.x, 2) +
                    Math.pow(last.y - first.y, 2)
                );

                const timeDiff = last.time - first.time;

                if (distance < this.stuckThreshold && timeDiff > this.timeThreshold) {
                    return true;
                }

                return false;
            }

            reset() {
                this.positions = [];
            }
        }

        // Глобальные объекты
        let ball, stuckDetector;

        // Основной цикл тестирования
        function testLoop() {
            if (!testRunning) return;

            const currentTime = performance.now();
            const dt = Math.min((currentTime - lastUpdateTime) / 1000, 1/30); // Ограничение 30 FPS
            lastUpdateTime = currentTime;

            frameCount++;

            // Очищаем канвас
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Обновляем мячик
            const speed = ball.update(dt);
            speedHistory.push(speed);
            if (speedHistory.length > 100) {
                speedHistory.shift();
            }

            // Проверяем застревание
            const isStuck = stuckDetector.addPosition(ball.x, ball.y);
            if (isStuck && stuckStartTime === 0) {
                stuckStartTime = Date.now();
                log('error', `Мяч застрял в позиции (${ball.x.toFixed(1)}, ${ball.y.toFixed(1)})`);
            } else if (!isStuck && stuckStartTime > 0) {
                const stuckDuration = Date.now() - stuckStartTime;
                totalStuckTime += stuckDuration;
                log('warn', `Мяч перестал застревать после ${stuckDuration}мс`);
                stuckStartTime = 0;
            }

            // Рисуем мячик
            ball.draw(ctx);

            // Рисуем границы
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(ball.radius + ball.edgePadding, ball.radius + ball.edgePadding,
                          ball.worldWidth - 2 * (ball.radius + ball.edgePadding),
                          ball.worldHeight - 2 * (ball.radius + ball.edgePadding));

            // Обновляем метрики
            updateMetrics();

            // Продолжаем тест
            requestAnimationFrame(testLoop);
        }

        // Управление тестом
        function startTest() {
            if (testRunning) return;

            log('info', 'Запуск UI теста...');
            updateStatus('running', 'Запущен');

            // Инициализация
            ball = new TestBall();
            stuckDetector = new StuckDetector();

            testRunning = true;
            testStartTime = Date.now();
            frameCount = 0;
            bounceCount = 0;
            totalStuckTime = 0;
            stuckStartTime = 0;
            lastUpdateTime = performance.now();
            speedHistory = [];

            // Запуск цикла
            requestAnimationFrame(testLoop);

            log('success', 'Тест запущен успешно');
        }

        function stopTest() {
            if (!testRunning) return;

            testRunning = false;
            updateStatus('pass', 'Остановлен');

            const testDuration = Date.now() - testStartTime;
            log('info', `Тест остановлен. Длительность: ${testDuration}мс`);

            // Финальная статистика
            if (totalStuckTime > 0) {
                log('error', `Общее время застревания: ${totalStuckTime}мс`);
            } else {
                log('success', 'Застреваний не обнаружено!');
            }

            log('info', `Всего отскоков: ${bounceCount}`);
            log('info', `Средняя скорость: ${(speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length).toFixed(1)} px/s`);
        }
    </script>
</body>
</html>
