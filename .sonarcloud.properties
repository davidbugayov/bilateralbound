# SonarCloud/SonarQube Configuration
# This file contains advanced configuration for code quality scanning

# Project metadata
sonar.projectKey=bound
sonar.projectName=EMDR Therapy Platform
sonar.projectDescription=Distributed EMDR therapy platform with modular architecture
sonar.projectVersion=2.39.241

# Source structure
sonar.sources=packages/server-core/server,packages/web-client/public/js
sonar.tests=scripts/e2e
sonar.projectBaseDir=.

# Exclusions (files and folders to skip)
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/spec/**,\
  **/webpack.config.js,\
  **/sonar-scanner.js,\
  **/.husky/**,\
  **/vendor/**,\
  **/*.bundle.js,\
  **/*.min.js,\
  **/public/panel/**,\
  **/public/assets/**

# Code coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*.test.js,**/scripts/e2e/**,**/node_modules/**

# Duplication detection (skip test files and vendor code)
sonar.cpd.exclusions=**/test/**,**/tests/**,**/vendor/**,**/public/js/vendor/**

# Code smells and security hotspots
sonar.javascript.node_modules=true

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Language and encoding
sonar.language=js
sonar.sourceEncoding=UTF-8

# Server connection
sonar.host.url=http://localhost:9000

# Logging (useful for debugging)
sonar.verbose=false

# Performance tuning
sonar.login=${SONAR_TOKEN}
sonar.password=

